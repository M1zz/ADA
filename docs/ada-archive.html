<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Design Awards Archive (2020–2026)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,300;1,14..32,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --surface-hi:#f8fafc;
    --line:#e2e8f0;
    --line-soft:#f1f5f9;
    --text:#0f172a;
    --muted:#64748b;
    --muted-dim:#94a3b8;
    --accent:#0ea5e9;
    --accent-dim:#0284c7;

    --c-delight:#f43f5e;
    --c-inclusivity:#10b981;
    --c-innovation:#3b82f6;
    --c-interaction:#8b5cf6;
    --c-social:#ec4899;
    --c-visuals:#f59e0b;
    --c-spatial:#06b6d4;
    --c-uncat:#6b7280;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    min-height:100vh;
    font-feature-settings:"cv02","cv03","cv04","cv11";
  }
  a{color:inherit;text-decoration:none}

  /* ── Header ── */
  header{max-width:1200px;margin:0 auto;padding:72px 32px 40px;position:relative}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);
    background:var(--line-soft);border:1px solid var(--line);
    border-radius:999px;padding:5px 12px;margin-bottom:28px;
  }
  .eyebrow-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
  h1{
    font-size:clamp(40px,6.5vw,80px);
    font-weight:800;
    line-height:1;
    letter-spacing:-0.04em;
    margin-bottom:20px;
    color:var(--text);
  }
  h1 .it{
    font-style:italic;
    font-weight:300;
    color:var(--accent);
    letter-spacing:-0.03em;
  }
  .lede{
    font-size:clamp(15px,1.6vw,17px);
    color:var(--muted);
    max-width:580px;
    line-height:1.75;
    font-weight:400;
  }
  .stats{
    display:flex;flex-wrap:wrap;gap:0;
    margin-top:40px;
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    width:fit-content;
  }
  .stat{
    padding:20px 32px;
    border-right:1px solid var(--line);
  }
  .stat:last-child{border-right:none}
  .stat .n{
    font-size:30px;font-weight:800;line-height:1;
    letter-spacing:-0.03em;color:var(--text);
  }
  .stat .l{font-size:12px;color:var(--muted);margin-top:5px;font-weight:500}

  /* ── Lang toggle ── */
  .lang-toggle{
    position:absolute;top:72px;right:32px;
    display:inline-flex;
    background:var(--line-soft);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .lang-btn{
    padding:5px 14px;cursor:pointer;background:transparent;border:none;
    font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.04em;
    color:var(--muted);transition:all .15s;border-radius:999px;
  }
  .lang-btn.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .lang-btn:hover:not(.active){color:var(--text);}

  /* ── Controls ── */
  .controls{
    position:sticky;top:0;z-index:40;
    background:rgba(255,255,255,0.88);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
    padding:12px 0 14px;
  }
  .controls-inner{max-width:1200px;margin:0 auto;padding:0 32px}
  .filter-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
  .filter-row:last-child{margin-bottom:0}
  .flabel{
    font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted-dim);width:68px;flex-shrink:0;font-weight:600;
  }
  .chip{
    font-family:inherit;font-size:12.5px;font-weight:500;
    color:var(--muted);background:transparent;
    border:1px solid var(--line);border-radius:999px;
    padding:5px 13px;cursor:pointer;transition:all .14s;
    white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
  }
  .chip:hover{color:var(--text);border-color:var(--muted-dim);background:var(--line-soft)}
  .chip.active{
    color:#fff;background:var(--text);border-color:var(--text);font-weight:600;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .search-wrap{position:relative;margin-left:auto;flex-grow:1;max-width:260px;min-width:160px}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.4}
  #search{
    width:100%;font-family:inherit;font-size:13px;
    color:var(--text);background:var(--surface);
    border:1px solid var(--line);border-radius:999px;
    padding:7px 14px 7px 34px;outline:none;
    transition:border-color .14s, box-shadow .14s;
  }
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,165,233,.1)}
  #search::placeholder{color:var(--muted-dim)}
  .toggle{
    display:inline-flex;align-items:center;gap:8px;
    cursor:pointer;font-size:12.5px;color:var(--muted);user-select:none;
  }
  .toggle .sw{
    width:36px;height:20px;border-radius:999px;
    background:var(--line);position:relative;transition:background .16s;flex-shrink:0;
  }
  .toggle .sw::after{
    content:"";position:absolute;
    width:14px;height:14px;border-radius:50%;
    background:#fff;top:3px;left:3px;
    transition:all .16s;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
  }
  .toggle.on .sw{background:var(--accent)}
  .toggle.on .sw::after{left:19px}
  .toggle.on{color:var(--text)}

  /* ── Main ── */
  main{max-width:1200px;margin:0 auto;padding:28px 32px 100px}
  .meta-line{font-size:12.5px;color:var(--muted-dim);margin-bottom:24px;font-weight:500}
  .meta-line b{color:var(--text);font-weight:700}

  .yeargroup{margin-bottom:52px}
  .yearhead{
    display:flex;align-items:center;gap:12px;
    margin-bottom:18px;padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .yearhead .yr{
    font-size:36px;font-weight:800;letter-spacing:-0.04em;color:var(--text);line-height:1;
  }
  .yearhead .yc{
    font-size:12px;color:var(--muted-dim);font-weight:500;
    background:var(--line-soft);border:1px solid var(--line);
    border-radius:6px;padding:3px 8px;
  }

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

  /* ── Card ── */
  .card{
    position:relative;background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px 20px 18px;
    overflow:hidden;display:flex;flex-direction:column;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .card::before{
    content:"";position:absolute;
    left:0;top:0;bottom:0;width:3px;
    background:var(--ac,var(--accent));
    border-radius:2px 0 0 2px;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 32px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04);
    border-color:var(--muted-dim);
  }

  .card-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
  .icon{
    width:54px;height:54px;border-radius:14px;flex-shrink:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);background:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  .icon img{width:100%;height:100%;object-fit:cover;display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .icon .mono{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;color:#fff;letter-spacing:-.01em;
    background:linear-gradient(135deg, var(--ac,var(--accent)), color-mix(in srgb, var(--ac,var(--accent)) 70%, #000 20%));
  }
  .head-text{min-width:0;flex:1}
  .head-text h3{
    font-weight:700;font-size:16px;line-height:1.25;
    letter-spacing:-0.02em;margin-bottom:3px;
    word-break:break-word;
  }
  .head-text h3 a:hover{color:var(--accent)}
  .dev{font-size:12px;color:var(--muted);font-weight:400}
  .dev .country{color:var(--muted-dim)}

  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
  .badge{
    font-size:10px;font-weight:600;letter-spacing:.02em;
    padding:3px 8px;border-radius:6px;white-space:nowrap;
  }
  .badge.cat{
    color:var(--ac,var(--accent));
    background:color-mix(in srgb,var(--ac,var(--accent)) 10%, #fff);
    border:1px solid color-mix(in srgb,var(--ac,var(--accent)) 22%, #fff);
  }
  .badge.type{color:var(--muted);background:var(--line-soft);border:1px solid var(--line)}
  .badge.award{display:inline-flex;align-items:center;gap:4px}
  .badge.award.winner{
    color:#92400e;
    background:#fef3c7;
    border:1px solid #fde68a;
  }
  .badge.award.finalist{color:var(--muted);background:var(--line-soft);border:1px solid var(--line)}

  .why{
    font-size:12.5px;line-height:1.6;color:#334155;font-weight:400;
    margin:10px 0 4px;padding:11px 13px;
    background:color-mix(in srgb,var(--ac,var(--accent)) 6%, #fff);
    border:1px solid color-mix(in srgb,var(--ac,var(--accent)) 16%, #fff);
    border-radius:11px;
  }
  .why-label{
    display:block;font-size:9.5px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ac,var(--accent));
    margin-bottom:5px;
  }
  .plats{font-size:11px;color:var(--muted-dim);margin-top:auto;padding-top:12px;font-weight:400}
  .dl{
    margin-top:12px;display:inline-flex;align-items:center;gap:5px;
    font-size:12px;font-weight:600;
    color:var(--text);
    border:1px solid var(--line);
    border-radius:8px;padding:6px 11px;
    align-self:flex-start;transition:all .14s;
    background:#fff;
  }
  .card .dl:hover{background:var(--text);color:#fff;border-color:var(--text)}
  .dl svg{transition:transform .14s}
  .card .dl:hover svg{transform:translate(1px,-1px)}

  .empty{text-align:center;padding:80px 20px;color:var(--muted-dim)}
  .empty .big{font-size:24px;font-weight:700;color:var(--muted);margin-bottom:8px;letter-spacing:-0.02em}
  .empty .sub{font-size:14px}

  /* ── Footer ── */
  footer{
    max-width:1200px;margin:0 auto;
    padding:28px 32px 64px;
    border-top:1px solid var(--line);
    color:var(--muted-dim);font-size:12px;line-height:1.9;
  }
  footer a{color:var(--accent-dim);text-decoration:underline;text-underline-offset:2px}

  /* ── Mobile ── */
  @media (max-width:600px){
    header{padding:52px 20px 32px}
    .lang-toggle{top:52px;right:20px}
    .controls-inner,main,footer{padding-left:20px;padding-right:20px}
    .flabel{width:100%;margin-bottom:2px}
    .search-wrap{margin-left:0;max-width:none}
    .grid{grid-template-columns:1fr}
    .stats{flex-direction:column;width:100%}
    .stat{border-right:none;border-bottom:1px solid var(--line)}
    .stat:last-child{border-bottom:none}
    .stat{padding:16px 20px}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow"><span class="eyebrow-dot"></span>Apple Design Awards · 2020–2026</div>
  <h1 id="mainTitle"></h1>
  <p class="lede" id="mainLede"></p>
  <div class="stats">
    <div class="stat"><div class="n" id="stWin">–</div><div class="l" id="stWinLabel"></div></div>
    <div class="stat"><div class="n" id="stFin">–</div><div class="l" id="stFinLabel"></div></div>
    <div class="stat"><div class="n">7</div><div class="l" id="stYearsLabel"></div></div>
    <div class="stat"><div class="n">7</div><div class="l" id="stCatsLabel"></div></div>
  </div>
  <div class="lang-toggle" aria-label="Language">
    <button class="lang-btn active" id="btnEn" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="btnKo" onclick="setLang('ko')">한국어</button>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <div class="filter-row">
      <span class="flabel" id="labelYear"></span>
      <div id="yearChips" class="chips"></div>
    </div>
    <div class="filter-row">
      <span class="flabel" id="labelCat"></span>
      <div id="catChips" class="chips"></div>
    </div>
    <div class="filter-row">
      <span class="flabel" id="labelType"></span>
      <button class="chip type active" data-type="all" id="chipAll"></button>
      <button class="chip type" data-type="app" id="chipApp"></button>
      <button class="chip type" data-type="game" id="chipGame"></button>
      <label class="toggle" id="finToggle" style="margin-left:14px">
        <span class="sw"></span><span id="finToggleLabel"></span>
      </label>
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="text" autocomplete="off">
      </div>
    </div>
  </div>
</div>

<main>
  <div class="meta-line" id="metaLine"></div>
  <div id="results"></div>
</main>

<footer id="mainFooter"></footer>

<script>
// ─── i18n ────────────────────────────────────────────────────────────────────
const STRINGS = {
  en: {
    title: 'ADA <span class="it">Winners</span><br>Archive',
    lede: 'The Apple Design Awards recognize apps and games that reflect excellence in design, innovation, and technology. Browse winners and finalists from 2020 to 2026 by category, year, and platform — each entry explains why it won, framed by its award category, with what to look for. App icons and App Store links are included.',
    statWin: 'Winners',
    statFin: 'Finalists',
    statYears: 'Years',
    statCats: 'Categories',
    labelYear: 'Year',
    labelCat: 'Category',
    labelType: 'Type',
    all: 'All',
    app: 'App',
    game: 'Game',
    inclFinalists: 'Include Finalists',
    searchPlaceholder: 'Search apps / developers…',
    metaWithFin: (total, win, fin) => `Total <b>${total}</b> — Winners <b>${win}</b> · Finalists <b>${fin}</b>`,
    metaWinOnly: (win) => `<b>${win}</b> Winner${win !== 1 ? 's' : ''}`,
    yearNote2020: 'Pre-category era · 8 apps',
    yearNote: (cats, items) => `${cats} categories · ${items} apps`,
    noResults: 'No results',
    noResultsSub: 'Try a different combination of filters.',
    awardWinner: 'Winner',
    awardFinalist: 'Finalist',
    typeApp: 'App',
    typeGame: 'Game',
    whyLabel: 'Why it won',
    dlBtn: 'App Store',
    footer: `Source: Apple Developer official <a href="https://developer.apple.com/design/awards/" target="_blank" rel="noopener">Apple Design Awards</a> page — data from 2020 to 2026.<br>
App icons are loaded live from the Apple iTunes API (internet connection required). Apps removed from the store are shown with an initial icon.
2020 selected 8 apps without category distinction, labeled as "Uncategorized". The app/game split for 2021–2022 reflects the nature of each work (official distinction began in 2023). Download links point to the US App Store; availability may vary by region.`,
  },
  ko: {
    title: '역대 ADA <span class="it">수상작</span><br>아카이브',
    lede: '애플이 매년 WWDC에서 디자인의 혁신성·독창성·기술적 성취를 인정해 선정하는 Apple Design Awards. 2020년부터 2026년까지의 수상작과 파이널리스트를 카테고리·연도·플랫폼별로 정리했으며, 각 작품마다 수상 카테고리 관점에서 "왜 상을 받았는지"와 관찰 포인트를 함께 설명합니다. 앱 아이콘과 App Store 다운로드 링크가 함께 제공됩니다.',
    statWin: '수상작 (Winners)',
    statFin: '파이널리스트',
    statYears: '개 연도',
    statCats: '개 카테고리',
    labelYear: '연도',
    labelCat: '카테고리',
    labelType: '유형',
    all: '전체',
    app: '앱',
    game: '게임',
    inclFinalists: '파이널리스트 포함',
    searchPlaceholder: '앱 / 개발사 검색…',
    metaWithFin: (total, win, fin) => `총 <b>${total}</b>개 — 수상작 <b>${win}</b> · 파이널리스트 <b>${fin}</b>`,
    metaWinOnly: (win) => `총 <b>${win}</b>개 수상작`,
    yearNote2020: '카테고리 도입 전 · 8개 작품',
    yearNote: (cats, items) => `${cats}개 카테고리 · ${items}개 작품`,
    noResults: '결과가 없습니다',
    noResultsSub: '다른 필터 조합을 시도해 보세요.',
    awardWinner: '수상',
    awardFinalist: '파이널리스트',
    typeApp: '앱',
    typeGame: '게임',
    whyLabel: '수상 포인트',
    dlBtn: 'App Store',
    footer: `출처: Apple Developer 공식 <a href="https://developer.apple.com/design/awards/" target="_blank" rel="noopener">Apple Design Awards</a> 페이지 — 2020~2026년 자료 기준.<br>
앱 아이콘은 페이지를 열 때 Apple iTunes API에서 실시간으로 불러옵니다(인터넷 연결 필요). 스토어에서 내려간 일부 앱·게임은 카테고리 색상의 이니셜 아이콘으로 대체됩니다. 2020년은 카테고리·앱/게임 구분 없이 8개 작품이 선정되어 '미분류'로 표기했고, 2021~2022년의 앱/게임 구분은 작품 성격에 따라 정리한 것입니다(2023년부터 Apple이 공식 구분). 다운로드 링크는 미국(US) App Store 기준이며 지역에 따라 제공 여부가 다를 수 있습니다.`,
  },
};

let lang = 'en';

function t(key, ...args){
  const val = STRINGS[lang][key];
  return typeof val === 'function' ? val(...args) : val;
}

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.getElementById('btnEn').classList.toggle('active', l === 'en');
  document.getElementById('btnKo').classList.toggle('active', l === 'ko');
  applyLang();
  buildChips();
  render();
}

function applyLang(){
  document.getElementById('mainTitle').innerHTML = t('title');
  document.getElementById('mainLede').textContent = t('lede');
  document.getElementById('stWinLabel').textContent = t('statWin');
  document.getElementById('stFinLabel').textContent = t('statFin');
  document.getElementById('stYearsLabel').textContent = t('statYears');
  document.getElementById('stCatsLabel').textContent = t('statCats');
  document.getElementById('labelYear').textContent = t('labelYear');
  document.getElementById('labelCat').textContent = t('labelCat');
  document.getElementById('labelType').textContent = t('labelType');
  document.getElementById('chipAll').textContent = t('all');
  document.getElementById('chipApp').textContent = t('app');
  document.getElementById('chipGame').textContent = t('game');
  document.getElementById('finToggleLabel').textContent = t('inclFinalists');
  document.getElementById('search').placeholder = t('searchPlaceholder');
  document.getElementById('mainFooter').innerHTML = t('footer');
}

// ─── Data ─────────────────────────────────────────────────────────────────────
const CATS = {
  delight:    {ko:"즐거움과 재미",  en:"Delight and Fun",      v:"--c-delight"},
  inclusivity:{ko:"포용성",         en:"Inclusivity",          v:"--c-inclusivity"},
  innovation: {ko:"혁신",           en:"Innovation",           v:"--c-innovation"},
  interaction:{ko:"인터랙션",       en:"Interaction",          v:"--c-interaction"},
  social:     {ko:"사회적 영향",     en:"Social Impact",        v:"--c-social"},
  visuals:    {ko:"비주얼 & 그래픽", en:"Visuals and Graphics", v:"--c-visuals"},
  spatial:    {ko:"공간 컴퓨팅",     en:"Spatial Computing",    v:"--c-spatial"},

// ─── Why it won (award rationale, EN/KO) ──────────────────────────────────────
const WHY = {
"(Not Boring) Camera": ["Recognized for Visuals and Graphics, this camera reimagines the capture UI with playful, tactile shaders and animated controls; watch how live filters and the fluid, hand-tuned interface turn a utilitarian tool into a visual toy.", "Visuals and Graphics 부문 수상작으로, 장난기 넘치고 촉각적인 셰이더와 애니메이션 컨트롤로 카메라 UI를 재해석했다. 실시간 필터와 손맛 나는 유려한 인터페이스가 실용적 도구를 시각적 장난감으로 바꾸는 점을 보라."],
"(Not Boring) Habits": ["Awarded for Delight and Fun plus Visuals and Graphics, this habit tracker turns routines into a buoyant, color-saturated playground; observe the bouncy fluid simulations, springy animations, and gradient artistry that make logging a habit feel like a reward.", "Delight and Fun과 Visuals and Graphics를 함께 수상한 습관 트래커로, 일상 루틴을 통통 튀고 색이 가득한 놀이터로 바꿨다. 출렁이는 유체 시뮬레이션, 탄력 있는 애니메이션, 그라데이션 아트가 기록 행위 자체를 보상처럼 느끼게 하는 점을 관찰해 보라."],
"(Not Boring) Weather": ["A Visuals and Graphics honoree that renders forecasts as living scenes; look at the stylized animated skies, fluid transitions, and bold typographic layout that turn raw weather data into a delightful piece of motion design.", "Visuals and Graphics 부문 수상작으로, 일기예보를 살아 움직이는 장면으로 렌더링한다. 양식화된 애니메이션 하늘, 유려한 전환, 과감한 타이포그래피 레이아웃이 무미건조한 기상 데이터를 즐거운 모션 디자인으로 바꾸는 점을 보라."],
"1Password": ["Honored for Inclusivity, the Mac app makes robust security usable for everyone through thorough VoiceOver support, keyboard navigation, and clear, legible design; the observation point is how complex credential management stays fully accessible without sacrificing power.", "Inclusivity 부문 수상작으로, 철저한 VoiceOver 지원, 키보드 내비게이션, 명료하고 가독성 높은 디자인을 통해 강력한 보안을 누구나 쓸 수 있게 했다. 복잡한 자격 증명 관리가 강력함을 잃지 않으면서도 완전한 접근성을 유지하는 점이 관찰 포인트다."],
"A Monster's Expedition": ["This box-pushing puzzler won Inclusivity for its forgiving, frustration-free design: infinite undo, no fail states, and no timers mean anyone can explore at their own pace; note how the gentle difficulty curve opens the genre to players of all abilities.", "상자 밀기 퍼즐 게임으로, 무한 되돌리기, 실패 상태 없음, 타이머 없음 같은 너그럽고 좌절 없는 설계로 Inclusivity를 수상했다. 완만한 난이도 곡선이 누구나 자기 속도로 즐길 수 있게 장르의 문턱을 낮추는 점에 주목하라."],
"A Musical Story": ["An Interaction winner where the controls become the music: you tap and hold in rhythm to recall psychedelic memories, and the observation point is how input timing and the act of playing are fused into one expressive, tactile loop.", "Interaction 부문 수상작으로, 조작 자체가 음악이 된다. 리듬에 맞춰 탭하고 길게 눌러 사이키델릭한 기억을 되살리며, 입력 타이밍과 연주 행위가 하나의 표현적이고 촉각적인 루프로 융합되는 점이 관찰 포인트다."],
"Active Arcade": ["Recognized for Social Impact and Innovation, it turns the camera into a motion controller so full-body movement drives the play, getting people active without wearables; watch how on-device body tracking makes accessible, screen-free-feeling exercise into a game.", "Social Impact과 Innovation을 함께 수상한 앱으로, 카메라를 모션 컨트롤러로 바꿔 온몸의 움직임으로 게임을 진행하며 웨어러블 없이 사람들을 움직이게 한다. 온디바이스 신체 추적이 접근성 높은 운동을 게임으로 만드는 점을 보라."],
"Afterplace": ["A Delight and Fun honoree, this pocket-sized open-world adventure packs charming secrets, witty surprises, and retro warmth into a one-thumb experience; the observation point is the dense, joyful discovery crammed into a deceptively small screen.", "Delight and Fun 부문 수상작으로, 손바닥만 한 오픈월드 모험에 매력적인 비밀, 재치 있는 깜짝 요소, 레트로 감성을 한 손 조작 경험으로 담아냈다. 작아 보이는 화면에 빽빽이 들어찬 즐거운 발견의 밀도가 관찰 포인트다."],
"Ahead: Emotions Coach": ["This emotional-intelligence coach won Social Impact for making mental wellbeing approachable through bite-sized, science-backed lessons; note how the friendly, low-pressure design helps people build self-awareness and manage emotions in daily life.", "감정 지능 코치 앱으로, 과학에 기반한 짧은 레슨으로 정서적 웰빙을 친근하게 만든 점으로 Social Impact을 수상했다. 부담 없고 다정한 디자인이 사람들의 자기 인식과 일상 속 감정 관리를 돕는 점에 주목하라."],
"Ahoy! From Picardy": ["A Vision Pro game honored for Social Impact, it uses spatial storytelling to foster connection and empathy; the observation point is how the immersive headset experience is shaped toward a warm, meaningful message rather than spectacle alone.", "Social Impact 부문을 수상한 Vision Pro 게임으로, 공간 스토리텔링을 통해 연결과 공감을 길러낸다. 몰입형 헤드셋 경험이 단순한 볼거리를 넘어 따뜻하고 의미 있는 메시지로 향하도록 설계된 점이 관찰 포인트다."],
"Alba: A Wildlife Adventure": ["Winning Inclusivity and Social Impact, this gentle conservation adventure invites players to save wildlife with no combat and an eco-positive message; observe how its accessible, low-stress design and real-world environmental theme work hand in hand.", "Inclusivity와 Social Impact을 함께 수상한 작품으로, 전투 없이 야생동물을 구하는 잔잔한 환경 보호 모험과 친환경 메시지를 담았다. 접근성 높고 스트레스 적은 설계와 실제 환경 보호 주제가 맞물려 작동하는 점을 관찰해 보라."],
"Alien: Isolation": ["A Visuals and Graphics winner, this console-grade horror port preserves the dread-soaked, cinematic art direction of the Nostromo on mobile; the observation point is the atmospheric lighting, detailed environments, and console-quality rendering on iPhone and iPad.", "Visuals and Graphics 부문 수상작으로, 콘솔급 호러 이식작이 노스트로모호의 공포 가득한 영화적 아트 디렉션을 모바일에 그대로 옮겼다. 분위기 있는 조명, 정교한 환경, 그리고 iPhone과 iPad에서 구현된 콘솔급 렌더링이 관찰 포인트다."],
"Ancient Board Game Collection": ["An Inclusivity honoree that revives historical board games with accessibility at the core; note the strong VoiceOver support, scalable visuals, and elegant minimalist design that let sighted and blind players enjoy these games equally.", "Inclusivity 부문 수상작으로, 접근성을 핵심에 두고 고대 보드게임들을 되살렸다. 탄탄한 VoiceOver 지원, 확대 가능한 그래픽, 우아한 미니멀 디자인이 시각 장애 여부와 무관하게 누구나 동등하게 즐기게 하는 점에 주목하라."],
"Anne": ["This game won Inclusivity for designing an experience that welcomes a broad range of players through thoughtful accessibility and approachable controls; the observation point is how its inclusive options let more people fully engage with the story and gameplay.", "Inclusivity 부문 수상작으로, 세심한 접근성과 친근한 조작을 통해 폭넓은 플레이어를 환영하는 경험을 설계했다. 포용적인 옵션들이 더 많은 사람들이 이야기와 게임플레이에 온전히 몰입하게 하는 점이 관찰 포인트다."],
"Any Distance": ["A Visuals and Graphics winner, this fitness app turns workout data into shareable art with bold 3D route maps, vibrant gradients, and animated activity cards; observe how it elevates run-tracking into expressive, design-forward visuals across iPhone and Watch.", "Visuals and Graphics 부문 수상작으로, 운동 데이터를 과감한 3D 경로 지도, 생생한 그라데이션, 애니메이션 활동 카드로 공유 가능한 작품으로 바꾼다. 러닝 기록을 표현력 있고 디자인 중심의 비주얼로 끌어올린 점을 iPhone과 Watch에서 관찰해 보라."],
"Arc Search": ["An Interaction honoree, this browser reinvents mobile search with gesture-driven flows like pull-to-refresh \"Browse for Me\" that builds a page for you; the observation point is how swipes, taps, and AI summarization combine into a uniquely fluid input model.", "Interaction 부문 수상작으로, 당겨서 새로고침하면 페이지를 대신 만들어 주는 \"Browse for Me\" 같은 제스처 기반 흐름으로 모바일 검색을 재발명했다. 스와이프, 탭, AI 요약이 독특하고 유려한 입력 방식으로 결합되는 점이 관찰 포인트다."],
"Arknights: Endfield": ["A Visuals and Graphics winner, this 3D real-time strategy RPG brings a richly stylized sci-fi world to mobile with striking character art and cinematic environments; observe the high-fidelity rendering and cohesive art direction running on iPhone and iPad.", "Visuals and Graphics 부문 수상작으로, 3D 실시간 전략 RPG가 짙은 양식미의 SF 세계를 인상적인 캐릭터 아트와 영화적 환경으로 모바일에 구현했다. iPhone과 iPad에서 구동되는 고품질 렌더링과 일관된 아트 디렉션을 관찰해 보라."],
"Art of Fauna": ["Honored for Inclusivity and Social Impact, this nature puzzle rebuilds historical wildlife illustrations using both image and text descriptions so blind and sighted players solve together; note how accessibility design doubles as a celebration of conservation art.", "Inclusivity와 Social Impact을 함께 수상한 자연 퍼즐로, 이미지와 텍스트 설명을 모두 활용해 고전 야생동물 삽화를 복원하며 시각 장애 여부와 무관하게 함께 풀 수 있게 한다. 접근성 설계가 동시에 자연 보호 예술에 대한 헌사가 되는 점에 주목하라."],
"Attentat 1942": ["A Social Impact winner, this educational game teaches WWII and Nazi occupation history through survivor interviews and archival material; the observation point is how documentary storytelling and historical authenticity turn play into meaningful remembrance.", "Social Impact 부문 수상작으로, 생존자 인터뷰와 기록 자료를 통해 제2차 세계대전과 나치 점령의 역사를 가르치는 교육용 게임이다. 다큐멘터리적 스토리텔링과 역사적 진정성이 게임을 의미 있는 기억의 행위로 바꾸는 점이 관찰 포인트다."],
"Automatoys": ["An Interaction honoree, this physics toy reduces a whole Rube Goldberg machine to a single button you tap with precise timing; observe how minimal one-touch input produces rich, cascading mechanical chain reactions full of tactile satisfaction.", "Interaction 부문 수상작으로, 복잡한 루브 골드버그 장치를 정확한 타이밍으로 누르는 단 하나의 버튼으로 압축했다. 최소한의 원터치 입력이 촉각적 만족감으로 가득한 풍성하고 연쇄적인 기계 반응을 만들어내는 점을 관찰해 보라."],
"Balatro": ["A Delight and Fun winner, this poker-roguelike delivers endlessly compelling \"just one more run\" hooks through clever joker synergies, satisfying score-multiplier crescendos, and CRT-warm charm; the observation point is the addictive, joyful escalation of each hand.", "Delight and Fun 부문 수상작으로, 포커 로그라이크가 영리한 조커 시너지, 짜릿한 점수 배수 클라이맥스, CRT 감성의 매력으로 \"딱 한 판만\" 하게 만드는 끝없는 중독성을 선사한다. 매 핸드마다 쌓이는 중독적이고 즐거운 고조감이 관찰 포인트다."],
"Ball x Pit": ["A Delight and Fun honoree, this brick-breaker-meets-roguelite layers escalating chaos, satisfying ball-bouncing feedback, and addictive build progression; observe how the moment-to-moment juiciness and chunky upgrade loop keep play irresistibly fun.", "Delight and Fun 부문 수상작으로, 벽돌깨기와 로그라이트를 결합해 점점 커지는 혼돈, 짜릿한 공 튕김 피드백, 중독적인 빌드 성장을 쌓아 올린다. 순간순간의 손맛과 묵직한 업그레이드 루프가 게임을 거부할 수 없이 즐겁게 만드는 점을 관찰해 보라."],
"Be My Eyes": ["A Social Impact winner, this app connects blind and low-vision users with sighted volunteers via live video for everyday help; the observation point is how a simple one-to-one video call model builds a global community that meaningfully betters daily life.", "Social Impact 부문 수상작으로, 시각 장애 사용자를 영상 통화로 자원봉사자와 연결해 일상의 도움을 제공한다. 단순한 일대일 영상 통화 모델이 일상을 의미 있게 개선하는 전 세계적 공동체를 만들어내는 점이 관찰 포인트다."],
"Bears Gratitude": ["A Delight and Fun honoree, this gratitude-journaling app wraps wellbeing in cheerful illustrated bears, warm animations, and a cozy, inviting mood; observe how the charming character design makes daily reflection feel light, friendly, and rewarding.", "Delight and Fun 부문 수상작으로, 감사 일기 앱이 명랑한 일러스트 곰들, 따뜻한 애니메이션, 아늑하고 포근한 분위기로 웰빙을 감싼다. 매력적인 캐릭터 디자인이 매일의 성찰을 가볍고 친근하며 보람 있게 만드는 점을 관찰해 보라."],
"Beecarbonize": ["A Social Impact winner, this card-based strategy game teaches the real tradeoffs of fighting climate change as you balance technology, society, and the planet; the observation point is how accessible card mechanics convey serious environmental systems thinking.", "Social Impact 부문 수상작으로, 카드 기반 전략 게임이 기술, 사회, 지구의 균형을 맞추며 기후 변화 대응의 실제 딜레마를 가르친다. 접근성 높은 카드 메커닉이 진지한 환경 시스템 사고를 전달하는 점이 관찰 포인트다."],
"Behind the Frame": ["A Visuals and Graphics honoree, this narrative game looks like a playable hand-painted animated film with anime-inspired, brushstroke-rich art; observe how the warm color palette and illustrated cutscenes make a painting-themed story feel like living art.", "Visuals and Graphics 부문 수상작으로, 내러티브 게임이 손으로 그린 애니메이션 영화처럼 보이는 애니풍의 붓터치 가득한 아트로 채워졌다. 따뜻한 색채와 일러스트 컷신이 그림을 주제로 한 이야기를 살아 있는 예술처럼 느끼게 하는 점을 관찰해 보라."],
"Beyond a Steel Sky": ["A Visuals and Graphics winner, this cyberpunk adventure brings a console-grade, comic-book-styled 3D world to mobile with cel-shaded art by Dave Gibbons; the observation point is the rich character design and stylized environments rendered at console quality.", "Visuals and Graphics 부문 수상작으로, 사이버펑크 어드벤처가 데이브 기번스의 셀 셰이딩 아트로 만화책 스타일의 콘솔급 3D 세계를 모바일에 구현했다. 콘솔 품질로 렌더링된 풍부한 캐릭터 디자인과 양식화된 환경이 관찰 포인트다."],
"Bird Alone": ["Winning Interaction and Innovation, this game has you converse with a parrot in real time through touch, drawing, and daily check-ins tied to the real calendar; the observation point is how natural, varied input and the passage of real time create a genuine bond.", "Interaction과 Innovation을 함께 수상한 게임으로, 터치, 그림 그리기, 실제 달력과 연동된 매일의 안부를 통해 앵무새와 실시간으로 교감한다. 자연스럽고 다양한 입력과 실제 시간의 흐름이 진짜 유대감을 만들어내는 점이 관찰 포인트다."],
"Blackbox": ["A Spatial Computing winner on Vision Pro, this puzzle game has you solve challenges using the environment around you rather than touchscreen taps; observe how it reimagines puzzle interaction for spatial computing using gaze, gesture, and physical space.", "Vision Pro의 Spatial Computing 부문 수상작으로, 터치스크린 탭 대신 주변 환경을 활용해 퍼즐을 푼다. 시선, 제스처, 물리적 공간을 활용해 퍼즐 상호작용을 공간 컴퓨팅에 맞게 재해석한 점을 관찰해 보라."],
"Blind Drive": ["An Innovation winner, this audio-only game has you drive into oncoming traffic using just sound and stereo headphones, no visuals needed; the observation point is how binaural audio design and reflex-based listening create a fully accessible, novel game form.", "Innovation 부문 수상작으로, 오직 소리와 스테레오 헤드폰만으로 마주 오는 차들 사이를 운전하는, 시각 요소가 필요 없는 오디오 전용 게임이다. 바이노럴 오디오 디자인과 청각 기반 반사 신경이 완전히 접근성 높은 새로운 게임 형식을 만들어내는 점이 관찰 포인트다."],
"Blippo+": ["A Delight and Fun honoree from Panic, this app is a surreal, fictional alien TV channel full of bizarre, lovingly crafted retro broadcasts; observe how the deadpan weirdness, vintage aesthetic, and endless oddball content deliver pure offbeat joy.", "Panic이 만든 Delight and Fun 부문 수상작으로, 기괴하고 정성껏 만들어진 레트로 방송으로 가득한 초현실적 가상 외계 TV 채널이다. 천연덕스러운 기묘함, 빈티지 감성, 끝없이 엉뚱한 콘텐츠가 순수하고 색다른 즐거움을 선사하는 점을 관찰해 보라."],
"Blue Prince": ["An Innovation winner, this game blends a shifting, draft-your-own mansion with deduction puzzles where the map is rebuilt every run; the observation point is the ingenious roguelike-meets-puzzle structure that makes each playthrough a fresh mystery.", "Innovation 부문 수상작으로, 매 플레이마다 지도가 새로 구성되는 가변형 저택과 추리 퍼즐을 결합했다. 매번 새로운 미스터리를 만들어내는 로그라이크와 퍼즐의 독창적 결합 구조가 관찰 포인트다."],
"Brief": ["A Social Impact honoree, this news app counters information overload and outrage with a calm, curated daily briefing focused on what matters; observe how its restrained design and ad-free, hype-free editorial approach promote healthier news habits.", "Social Impact 부문 수상작으로, 정보 과부하와 분노를 차분하고 엄선된 일일 브리핑으로 대응하며 정말 중요한 것에 집중한다. 절제된 디자인과 광고 없고 자극 없는 편집 방식이 더 건강한 뉴스 소비 습관을 장려하는 점을 관찰해 보라."],
"CARROT Weather": ["An Interaction winner, this weather app pairs forecasts with a snarky AI personality and a deeply customizable, layered interface you tap and explore; the observation point is how interactive secret locations, jokes, and configurable data layouts make checking weather playful.", "Interaction 부문 수상작으로, 날씨 앱이 예보를 빈정대는 AI 캐릭터와 탭하며 탐색하는 깊은 커스터마이즈가 가능한 레이어드 인터페이스와 결합했다. 인터랙티브한 비밀 장소, 농담, 설정 가능한 데이터 배치가 날씨 확인을 놀이로 만드는 점이 관찰 포인트다."],
"CREME": ["A Delight and Fun honoree, this game leans into charming, playful design and lighthearted moment-to-moment surprises; observe how its inviting visual character and joyful interactions make it feel warm, expressive, and fun to simply spend time in.", "Delight and Fun 부문 수상작으로, 매력적이고 장난기 넘치는 디자인과 가벼운 순간순간의 깜짝 요소에 집중했다. 친근한 비주얼 캐릭터와 즐거운 상호작용이 그저 머물러 있기만 해도 따뜻하고 표현력 있으며 즐겁게 느껴지게 하는 점을 관찰해 보라."],
"Call of Duty: Warzone Mobile": ["Recognized for Innovation, it shrinks a console-grade battle royale onto iPhone and iPad with shared maps and progression across platforms; watch how it maintains large-scale 120-player matches and high-fidelity environments through Apple silicon optimization and Metal.", "혁신 부문 수상작으로, 콘솔급 배틀로얄을 아이폰과 아이패드에 옮기면서 플랫폼 간 맵과 진행 상황을 공유한다. 애플 실리콘 최적화와 Metal을 통해 대규모 120인 매치와 고품질 환경을 유지하는 점을 눈여겨보라."],
"Camo Studio": ["Awarded for Innovation for turning an iPhone into a pro-grade Mac webcam, it leverages Continuity and computational imaging to deliver studio-quality video; note the real-time color grading, framing, and exposure controls that surpass built-in cameras.", "혁신 부문 수상작으로, 아이폰을 맥의 전문가급 웹캠으로 바꿔준다. 연속성 기능과 컴퓨테이셔널 이미징을 활용해 스튜디오 품질의 영상을 구현하며, 내장 카메라를 능가하는 실시간 색보정·프레이밍·노출 제어를 주목하라."],
"CapWords": ["This Delight and Fun winner makes vocabulary learning playful by snapping real-world objects and instantly turning them into illustrated, labeled word cards; the joy lives in the camera-to-card animation and charming visual feedback.", "딜라이트 앤 펀 부문 수상작으로, 실제 사물을 촬영하면 즉시 일러스트와 라벨이 붙은 단어 카드로 바꿔 어휘 학습을 놀이처럼 만든다. 카메라에서 카드로 이어지는 애니메이션과 사랑스러운 시각 피드백에 즐거움이 담겨 있다."],
"Capybara AI Meeting Translator": ["Honored for Innovation, it applies on-device-friendly AI to translate live meetings in real time across languages; the observation point is its low-latency speech recognition and translation pipeline that keeps conversations flowing.", "혁신 부문 수상작으로, AI를 활용해 회의를 실시간으로 여러 언어로 통역한다. 대화의 흐름을 끊지 않는 저지연 음성 인식과 번역 파이프라인이 핵심 관찰 포인트다."],
"Caradise": ["A Visuals and Graphics honoree on Vision Pro, it renders automobiles as photoreal, life-scale 3D models you can walk around and inspect; look at the material fidelity, reflections, and lighting that hold up at spatial scale.", "비전 프로용 비주얼 앤 그래픽스 부문 수상작으로, 자동차를 실물 크기의 사실적인 3D 모델로 렌더링해 둘러보고 살펴볼 수 있게 한다. 공간 스케일에서도 무너지지 않는 재질 표현, 반사, 조명을 눈여겨보라."],
"CellWalk": ["This Visuals and Graphics winner lets you step inside a scientifically modeled living cell on Vision Pro; the craft to observe is its rendering of molecular structures at true scale, turning biology into an explorable, beautiful spatial environment.", "비주얼 앤 그래픽스 부문 수상작으로, 비전 프로에서 과학적으로 모델링된 살아있는 세포 내부를 거닐 수 있게 한다. 분자 구조를 실제 스케일로 렌더링해 생물학을 탐험 가능한 아름다운 공간으로 바꾼 점이 관찰 포인트다."],
"Chantlings": ["A Delight and Fun honoree, this game charms with its whimsical creatures and tactile, hand-crafted world; the delight is in the playful animations and the cozy, imaginative tone that invites unhurried exploration.", "딜라이트 앤 펀 부문 수상작으로, 기발한 생명체와 손맛 나는 정성스러운 세계로 매력을 발산한다. 여유로운 탐험을 권하는 장난기 가득한 애니메이션과 아늑하고 상상력 넘치는 분위기에 즐거움이 있다."],
"Chineasy": ["Awarded for Delight and Fun, it teaches Chinese characters by transforming them into charming illustrations that reveal each character's meaning; the joy is in the visual mnemonics that make a daunting writing system feel approachable.", "딜라이트 앤 펀 부문 수상작으로, 한자를 매력적인 일러스트로 바꿔 각 글자의 의미를 드러내며 가르친다. 어려운 문자 체계를 친근하게 만드는 시각적 연상 기법에 즐거움이 담겨 있다."],
"Cityscapes: Sim Builder": ["This Social Impact honoree reframes city-building around sustainability and livability, prompting players to balance growth with environmental and social needs; note how its simulation surfaces the real trade-offs of urban planning.", "소셜 임팩트 부문 수상작으로, 도시 건설을 지속가능성과 삶의 질 중심으로 재구성해 성장과 환경·사회적 필요의 균형을 고민하게 만든다. 도시 계획의 실제 트레이드오프를 드러내는 시뮬레이션 방식을 주목하라."],
"Complete Anatomy 2024": ["An Inclusivity winner, this medical platform makes advanced 3D anatomy learning broadly accessible with multilingual content and adaptable tools for diverse learners; the observation point is its inclusive, layered interface serving both students and clinicians.", "인클루시비티 부문 수상작으로, 다국어 콘텐츠와 다양한 학습자를 위한 도구로 고급 3D 해부학 학습을 폭넓게 접근 가능하게 만든다. 학생과 임상의를 모두 아우르는 포용적이고 층위가 풍부한 인터페이스가 관찰 포인트다."],
"Consume Me": ["This Social Impact honoree tackles disordered eating and body image through an honest, autobiographical game design; the point to observe is how its mechanics translate the lived experience of dieting and self-control into reflective play.", "소셜 임팩트 부문 수상작으로, 자전적이고 솔직한 게임 디자인을 통해 섭식 장애와 신체 이미지 문제를 다룬다. 다이어트와 자기 통제의 실제 경험을 성찰적 플레이로 옮긴 메커니즘을 눈여겨보라."],
"Control Ultimate Edition": ["A Visuals and Graphics winner, it brings Remedy's surreal Brutalist world to Mac with ray-traced reflections and destructible environments; observe how Apple silicon and Metal render its shifting architecture and physics-driven chaos.", "비주얼 앤 그래픽스 부문 수상작으로, 레메디의 초현실적 브루탈리즘 세계를 레이트레이싱 반사와 파괴 가능한 환경과 함께 맥으로 가져왔다. 애플 실리콘과 Metal이 변형되는 건축과 물리 기반의 혼돈을 어떻게 렌더링하는지 관찰하라."],
"Copilot Money": ["Honored for Innovation, it rethinks personal finance with intelligent transaction categorization and clear, native design across iPhone and Mac; the observation point is its smart automation and polished data visualization that make budgeting effortless.", "혁신 부문 수상작으로, 지능형 거래 분류와 아이폰·맥에 걸친 명료한 네이티브 디자인으로 개인 재무 관리를 새롭게 정의한다. 예산 관리를 수월하게 만드는 스마트 자동화와 세련된 데이터 시각화가 관찰 포인트다."],
"Craft": ["An Interaction winner, this document and notes app excels through fluid, responsive editing and thoughtful gestures across iPhone, iPad, and Mac; note how its blocks, linking, and drag interactions make structured writing feel effortless.", "인터랙션 부문 수상작으로, 아이폰·아이패드·맥에서 유려하고 반응성 높은 편집과 세심한 제스처로 빛난다. 블록, 링크, 드래그 인터랙션이 구조적 글쓰기를 수월하게 만드는 방식을 눈여겨보라."],
"Crayola Adventures": ["This Inclusivity honoree invites children of all abilities into creative play with approachable controls and broad customization; the observation point is its accessible, low-barrier design that welcomes a wide range of young players.", "인클루시비티 부문 수상작으로, 친근한 조작과 폭넓은 커스터마이징으로 모든 능력의 아이들을 창의적 놀이로 초대한다. 다양한 어린 플레이어를 포용하는 접근성 높고 진입 장벽이 낮은 디자인이 관찰 포인트다."],
"Crouton": ["An Interaction winner, this recipe app shines with delightful, friction-free gestures and a cook-mode that adapts across iPhone, iPad, Watch, and Vision Pro; observe its thoughtful screen-on cooking flow and tactile, native interactions.", "인터랙션 부문 수상작으로, 즐겁고 마찰 없는 제스처와 아이폰·아이패드·워치·비전 프로에 걸쳐 적응하는 요리 모드로 빛난다. 화면을 켜둔 채 이어지는 사려 깊은 요리 흐름과 손맛 나는 네이티브 인터랙션을 관찰하라."],
"Cyberpunk 2077 Ultimate Edition": ["A Visuals and Graphics winner, it delivers Night City's dense neon metropolis on Mac with ray tracing and high-fidelity lighting; the observation point is how Apple silicon and MetalFX upscaling sustain its sprawling, atmospheric cityscape.", "비주얼 앤 그래픽스 부문 수상작으로, 나이트 시티의 빽빽한 네온 대도시를 레이트레이싱과 고품질 조명과 함께 맥으로 구현한다. 애플 실리콘과 MetalFX 업스케일링이 광활하고 분위기 있는 도시 풍경을 어떻게 지탱하는지가 관찰 포인트다."],
"D-Day: The Camera Soldier": ["An Innovation honoree on Vision Pro, it uses spatial storytelling and archival imagery to immerse you in a WWII photographer's perspective; observe how it blends documentary footage with immersive spatial scenes to make history tangible.", "비전 프로용 혁신 부문 수상작으로, 공간 스토리텔링과 기록 영상을 활용해 제2차 세계대전 종군 사진가의 시점에 몰입시킨다. 다큐멘터리 영상과 몰입형 공간 장면을 결합해 역사를 생생하게 만드는 방식을 관찰하라."],
"DEATH STRANDING DIRECTOR'S CUT": ["A Visuals and Graphics winner, it brings Kojima's cinematic, desolate landscapes to iPhone, iPad, and Mac with console-level detail; the observation point is its photoreal terrain, character rendering, and atmospheric scale on Apple silicon.", "비주얼 앤 그래픽스 부문 수상작으로, 코지마 특유의 영화적이고 황량한 풍경을 콘솔급 디테일로 아이폰·아이패드·맥에 가져왔다. 애플 실리콘에서 구현된 사실적 지형, 캐릭터 렌더링, 분위기 있는 스케일이 관찰 포인트다."],
"DREDGE": ["An Interaction winner, this eerie fishing adventure excels with intuitive, tactile controls for navigation, fishing, and inventory management on touch and Mac; note how its responsive input keeps the unsettling exploration smooth and immersive.", "인터랙션 부문 수상작으로, 으스스한 낚시 어드벤처로서 항해·낚시·인벤토리 관리를 직관적이고 손맛 나는 조작으로 빛낸다. 반응성 높은 입력이 불안한 탐험을 매끄럽고 몰입감 있게 유지하는 방식을 눈여겨보라."],
"Darkroom": ["A pre-category-era winner (2020), this photo and video editor earned recognition for its powerful yet approachable, beautifully native editing tools; observe its non-destructive workflow and elegant, gesture-driven adjustments.", "카테고리 도입 이전 시기(2020)의 수상작으로, 강력하면서도 친근하고 아름다운 네이티브 편집 도구로 인정받았다. 비파괴 편집 워크플로와 우아한 제스처 기반 조정을 관찰하라."],
"Denim – Playlist Cover Maker": ["A Delight and Fun honoree, it turns making playlist artwork into a quick, joyful act with stylish templates and instant, satisfying results; the delight is in its tasteful design presets and the playful ease of creating shareable covers.", "딜라이트 앤 펀 부문 수상작으로, 세련된 템플릿과 즉각적이고 만족스러운 결과로 플레이리스트 커버 제작을 빠르고 즐거운 행위로 바꾼다. 감각적인 디자인 프리셋과 공유 가능한 커버를 만드는 장난스러운 손쉬움에 즐거움이 있다."],
"Detail: AI Video Editor": ["Honored for Innovation, it applies AI to streamline video capture and editing, even using Watch as a remote; the observation point is how its automation handles framing, editing, and multi-device shooting to simplify content creation.", "혁신 부문 수상작으로, AI를 활용해 영상 촬영과 편집을 간소화하며 워치를 리모컨으로도 쓸 수 있다. 프레이밍, 편집, 멀티 디바이스 촬영을 자동화해 콘텐츠 제작을 단순화하는 방식이 관찰 포인트다."],
"Diablo Immortal": ["A Visuals and Graphics winner, it delivers Diablo's gothic dungeons and spell effects at console fidelity on iPhone and iPad; observe its dramatic lighting, detailed character models, and particle-rich combat rendered on mobile Apple silicon.", "비주얼 앤 그래픽스 부문 수상작으로, 디아블로의 고딕 던전과 주문 효과를 콘솔급 품질로 아이폰과 아이패드에 구현한다. 모바일 애플 실리콘에서 렌더링되는 극적인 조명, 정교한 캐릭터 모델, 파티클이 풍부한 전투를 관찰하라."],
"Dudel Draw": ["A Delight and Fun honoree, this drawing app charms with playful brushes, quirky tools, and a lighthearted, creativity-first spirit; the joy lives in its whimsical interactions and the satisfying, unpolished fun of doodling.", "딜라이트 앤 펀 부문 수상작으로, 장난스러운 브러시와 기발한 도구, 창의성을 우선하는 가벼운 분위기로 매력을 더한다. 엉뚱한 인터랙션과 낙서하는 만족스러운 즐거움에 기쁨이 담겨 있다."],
"Duolingo": ["Awarded for both Delight and Fun and Social Impact, it makes language learning addictive through playful streaks, characters, and animations while broadening access to education worldwide; observe how its gameful loop and friendly mascot drive daily habit and real learning.", "딜라이트 앤 펀과 소셜 임팩트 두 부문 수상작으로, 연속 학습, 캐릭터, 애니메이션으로 언어 학습을 중독성 있게 만들면서 전 세계 교육 접근성을 넓힌다. 게임적 루프와 친근한 마스코트가 매일의 습관과 실제 학습을 이끄는 방식을 관찰하라."],
"Empathy": ["A Social Impact winner, it guides people through grief and the logistics of loss with compassionate, step-by-step support; the observation point is its sensitive design that meets users in a difficult moment with calm, practical care.", "소셜 임팩트 부문 수상작으로, 사별과 상실의 실무적 절차를 따뜻하고 단계적인 안내로 도와준다. 어려운 순간에 차분하고 실용적인 배려로 사용자를 맞이하는 섬세한 디자인이 관찰 포인트다."],
"Endling": ["Honored for Social Impact and Visuals and Graphics, this game casts you as the last mother fox in a dying world, using its hauntingly beautiful art to drive an environmental message; observe how its melancholic visuals and survival stakes make ecological loss deeply felt.", "소셜 임팩트와 비주얼 앤 그래픽스 부문 수상작으로, 죽어가는 세계의 마지막 어미 여우가 되어 애절하게 아름다운 아트로 환경 메시지를 전한다. 우울한 비주얼과 생존의 긴박함이 생태적 상실을 깊이 체감하게 만드는 방식을 관찰하라."],
"Evolve: Daily Self-Care Coach": ["An Inclusivity winner, this self-care app offers accessible, welcoming mental-wellness guidance designed for a broad range of users; the observation point is its inclusive content and gentle, approachable interface that meets diverse needs.", "인클루시비티 부문 수상작으로, 폭넓은 사용자를 위해 접근하기 쉽고 따뜻한 정신 건강 안내를 제공한다. 다양한 필요를 아우르는 포용적 콘텐츠와 부드럽고 친근한 인터페이스가 관찰 포인트다."],
"Feather: Draw in 3D": ["A Visuals and Graphics winner, it lets you draw in true three-dimensional space on iPad with elegant strokes that float and layer; observe how its 3D brushwork and rendering turn sketching into a sculptural, spatial visual experience.", "비주얼 앤 그래픽스 부문 수상작으로, 아이패드에서 공중에 떠 겹쳐지는 우아한 선으로 진정한 3차원 공간에 그림을 그리게 한다. 3D 붓질과 렌더링이 스케치를 조각적이고 공간적인 시각 경험으로 바꾸는 방식을 관찰하라."],
"Finding Hannah": ["An Inclusivity honoree, this hidden-object narrative game broadens who casual games speak to with an accessible design and a heartfelt, women-centered story; observe how its inclusive difficulty and warm storytelling welcome a wider audience.", "인클루시비티 부문 수상작으로, 접근성 높은 디자인과 여성 중심의 진솔한 이야기로 캐주얼 게임이 말을 거는 대상을 넓힌다. 포용적인 난이도와 따뜻한 스토리텔링이 더 넓은 관객을 맞이하는 방식을 관찰하라."],
"Flighty": ["An Interaction winner, this flight tracker excels with live, glanceable updates and fluid, responsive interactions across iPhone, iPad, and Mac; the observation point is its proactive live activities and smooth data-rich interface that anticipate travelers' needs.", "인터랙션 부문 수상작으로, 실시간으로 한눈에 보이는 업데이트와 아이폰·아이패드·맥에 걸친 유려하고 반응성 높은 인터랙션으로 빛난다. 여행자의 필요를 예측하는 선제적인 라이브 액티비티와 매끄럽고 정보가 풍부한 인터페이스가 관찰 포인트다."],
"Focus Noodles": ["An Innovation honoree, this focus and productivity app takes a novel, playful approach to concentration and time management; the observation point is its inventive mechanic for keeping users engaged and on task.", "혁신 부문 수상작으로, 집중과 시간 관리에 새롭고 장난스러운 방식으로 접근하는 생산성 앱이다. 사용자의 몰입과 집중을 유지시키는 독창적인 메커니즘이 관찰 포인트다."],
"Gears & Goo": ["Honored for Innovation and Interaction on Vision Pro, this tower-defense game reimagines strategy in spatial computing with hand-tracked controls and a tabletop-scale world; observe how you reach into and manipulate the battlefield directly in your room.", "비전 프로용 혁신과 인터랙션 부문 수상작으로, 손 추적 조작과 탁상 스케일의 세계로 타워 디펜스 전략을 공간 컴퓨팅에서 재해석한다. 방 안에서 전장에 직접 손을 뻗어 조작하는 방식을 관찰하라."],
"Genshin Impact": ["A Visuals and Graphics winner, it brings a vast, stylized open world with anime-style cel rendering and dynamic weather to iPhone and iPad; observe its expansive vistas, fluid character animation, and elemental effects running on mobile Apple silicon.", "비주얼 앤 그래픽스 부문 수상작으로, 애니메이션풍 셀 렌더링과 역동적인 날씨가 어우러진 광활하고 양식화된 오픈월드를 아이폰과 아이패드에 구현한다. 모바일 애플 실리콘에서 구동되는 광대한 전경, 유려한 캐릭터 애니메이션, 원소 효과를 관찰하라."],
"Gentler Streak Fitness Tracker": ["A fitness companion recognized for Social Impact because it reframes wellbeing around rest and balance rather than relentless streaks, gently steering users away from overtraining and burnout. Observation point: the Go-Zone activity gauge and adaptive rest-day guidance that adjusts to your body instead of demanding daily perfection.", "쉼과 균형을 중심으로 건강을 재정의해 과도한 운동과 번아웃에서 사용자를 부드럽게 보호한 점에서 사회적 영향력 부문을 수상했다. 관찰 포인트: 매일의 완벽함을 강요하지 않고 몸 상태에 맞춰 조정되는 Go-Zone 활동 게이지와 적응형 휴식일 안내."],
"Gentler Streak Health Fitness": ["The same wellbeing app honored for Visuals and Graphics, where data becomes a calm, legible visual language across iPhone and Watch. Observation point: the arched Go-Zone rings, warm color gradients, and elegant typography that make activity metrics feel approachable rather than clinical.", "건강 데이터를 차분하고 읽기 쉬운 시각 언어로 풀어낸 점에서 비주얼 및 그래픽 부문을 수상했다. 관찰 포인트: 활동 지표를 임상적이지 않고 친근하게 느껴지게 하는 아치형 Go-Zone 링, 따뜻한 색 그라데이션, 우아한 타이포그래피."],
"Gibbon: Beyond the Trees": ["A hand-animated swinging adventure praised for Interaction and Social Impact: its momentum-based brachiation turns simple swipes into fluid, physical motion while the wordless story confronts deforestation and habitat loss. Observation point: the flow of chained swings that builds speed, paired with the somber environmental narrative underneath the beauty.", "운동량 기반의 나무 사이 이동이 단순한 스와이프를 유려한 신체적 동작으로 바꾸고, 대사 없는 이야기가 삼림 파괴와 서식지 상실을 다룬 점에서 인터랙션과 사회적 영향력을 인정받았다. 관찰 포인트: 속도가 쌓이는 연속 스윙의 흐름과 그 아름다움 아래 깔린 묵직한 환경 서사."],
"Grand Mountain Adventure 2": ["An open-mountain skiing game awarded for Interaction thanks to controls that capture the carve and weight of downhill momentum with remarkable feel. Observation point: how touch input translates into responsive edge-to-edge turns, jumps, and speed across freely explorable slopes.", "다운힐의 무게감과 카빙을 놀랍도록 잘 살린 조작감으로 인터랙션 부문을 수상한 오픈 마운틴 스키 게임이다. 관찰 포인트: 자유롭게 탐험하는 슬로프에서 터치 입력이 반응성 높은 회전, 점프, 속도로 변환되는 방식."],
"Ground News": ["A news app honored for Social Impact for fighting media bias and polarization by showing the political spread behind every story. Observation point: the bias-distribution bar and side-by-side coverage comparison that reveals who is reporting a story, how, and what you might be missing.", "모든 기사 뒤의 정치적 성향 분포를 보여주며 언론 편향과 양극화에 맞선 점에서 사회적 영향력 부문을 수상한 뉴스 앱이다. 관찰 포인트: 누가 어떻게 보도하는지, 무엇을 놓치고 있는지 드러내는 편향 분포 막대와 좌우 보도 비교."],
"Guitar Wiz": ["A guitar-learning app recognized for Inclusivity for making music instruction accessible across iPhone, iPad, Mac, and Watch and welcoming learners of varied abilities. Observation point: its multi-device, clearly structured lessons and feedback designed to lower the barrier to picking up an instrument.", "iPhone, iPad, Mac, Watch를 아우르며 다양한 수준의 학습자를 포용하는 음악 교육을 구현한 점에서 포용성 부문을 수상한 기타 학습 앱이다. 관찰 포인트: 악기 입문의 문턱을 낮추도록 설계된 멀티 디바이스의 명료한 단계별 레슨과 피드백."],
"Halide Mark II": ["A pro camera app awarded for Visuals and Graphics for giving photographers true manual control and computational depth on iPhone. Observation point: the focus-peaking, RAW capture, and macro tooling presented through an interface that puts serious imaging craft at your fingertips.", "iPhone에서 사진가에게 진정한 수동 제어와 연산 사진 깊이를 제공한 점에서 비주얼 및 그래픽 부문을 수상한 프로 카메라 앱이다. 관찰 포인트: 본격적인 촬영 기술을 손끝에 쥐어 주는 인터페이스로 구현된 포커스 피킹, RAW 촬영, 매크로 도구."],
"Harvee": ["A health-focused app honored for Social Impact for supporting people through serious or chronic health journeys on iPhone and Watch. Observation point: its compassionate, clearly organized tracking and guidance built to ease the daily burden of managing one's health.", "iPhone과 Watch에서 중증 혹은 만성 질환을 겪는 사람들의 여정을 지원한 점에서 사회적 영향력 부문을 수상한 건강 앱이다. 관찰 포인트: 일상적인 건강 관리 부담을 덜어 주도록 만들어진 공감 어린 기록과 명료하게 정리된 안내."],
"Headspace": ["A meditation and mental-health app repeatedly honored for Social Impact for making mindfulness approachable and scientifically grounded for millions. Observation point: the friendly, animated guided sessions and the seamless Watch and Health integration that lower the barrier to a daily mental-wellness practice.", "수백만 명에게 마음챙김을 친근하고 과학적으로 접근 가능하게 만든 점에서 사회적 영향력 부문을 거듭 수상한 명상·정신건강 앱이다. 관찰 포인트: 매일의 정신 건강 습관 문턱을 낮추는 다정한 애니메이션 가이드 세션과 매끄러운 Watch·건강 앱 연동."],
"Hearing Buddy": ["An app recognized for Inclusivity for helping people who are deaf or hard of hearing navigate everyday sound on iPhone, iPad, and Watch. Observation point: its real-time sound awareness and accessible, glanceable alerts designed around the needs of the hearing community.", "청각 장애가 있거나 잘 듣지 못하는 사람들이 일상의 소리를 인지하도록 도운 점에서 포용성 부문을 수상한 앱이다. 관찰 포인트: 청각 커뮤니티의 필요를 중심으로 설계된 실시간 소리 인식과 한눈에 보이는 접근성 알림."],
"Hello Kitty Island Adventure": ["A cozy social adventure awarded for Delight and Fun for its overflowing charm, warmth, and easygoing joy. Observation point: the adorable Sanrio character interactions, gentle exploration, and customization that make every session feel cheerful and welcoming.", "넘치는 매력과 따뜻함, 편안한 즐거움으로 환희와 재미 부문을 수상한 아늑한 소셜 어드벤처다. 관찰 포인트: 매 플레이를 밝고 환영받는 기분으로 만드는 사랑스러운 산리오 캐릭터 상호작용, 잔잔한 탐험, 꾸미기 요소."],
"Hindsight": ["A narrative game honored for Social Impact for its tender, introspective story about memory, family, and letting go. Observation point: the tactile object-manipulation that turns household keepsakes into emotional portals through a life's milestones.", "기억, 가족, 그리고 놓아주는 것에 관한 섬세하고 내성적인 이야기로 사회적 영향력 부문을 수상한 내러티브 게임이다. 관찰 포인트: 집안의 추억 물건들을 인생의 이정표로 이어지는 감정적 통로로 바꾸는 촉각적 사물 조작."],
"HoloVista": ["An interactive narrative game recognized for Inclusivity for telling an immersive story through an accessible, photo-based interface. Observation point: its tap-to-explore room scenes and inclusive storytelling that invite a wide audience into a mystery without demanding twitch skills.", "사진 기반의 접근하기 쉬운 인터페이스로 몰입형 이야기를 전한 점에서 포용성 부문을 수상한 인터랙티브 내러티브 게임이다. 관찰 포인트: 반사 신경을 요구하지 않고 폭넓은 사용자를 미스터리로 초대하는 탭 탐색형 방 장면과 포용적 스토리텔링."],
"Honkai: Star Rail": ["A turn-based RPG awarded for Visuals and Graphics for its lavish anime art direction and cinematic rendering running smoothly on iPhone. Observation point: the stylized character models, dramatic Ultimate cutscenes, and richly detailed environments that rival console production values.", "화려한 애니메이션 아트 디렉션과 영화적 렌더링을 iPhone에서 매끄럽게 구현한 점에서 비주얼 및 그래픽 부문을 수상한 턴제 RPG다. 관찰 포인트: 콘솔급 완성도에 견주는 양식화된 캐릭터 모델, 극적인 궁극기 컷신, 섬세하게 묘사된 배경."],
"How We Feel": ["An emotional-wellbeing app honored for Social Impact for helping people build emotional literacy and recognize their feelings. Observation point: the mood-mapping color wheel and science-backed prompts that turn fuzzy feelings into nameable, trackable emotions.", "사람들이 감정 문해력을 키우고 자신의 기분을 인식하도록 도운 점에서 사회적 영향력 부문을 수상한 정서 건강 앱이다. 관찰 포인트: 모호한 감정을 이름 붙이고 추적 가능한 감정으로 바꿔 주는 기분 매핑 컬러 휠과 과학에 기반한 질문들."],
"If Found...": ["A visual-novel game recognized for Social Impact for its deeply human story of identity, belonging, and a trans woman returning home in 1990s Ireland. Observation point: the signature erasing mechanic, where you rub away the page to advance the diary, making you a participant in the act of remembering.", "1990년대 아일랜드를 배경으로 정체성과 소속, 집으로 돌아온 트랜스 여성의 깊이 있는 인간적 이야기로 사회적 영향력 부문을 수상한 비주얼 노벨이다. 관찰 포인트: 페이지를 문질러 지우며 일기를 진행시켜 기억하는 행위에 직접 참여하게 만드는 특유의 지우기 메커니즘."],
"Infinity Nikki": ["An open-world dress-up adventure awarded for Visuals and Graphics for its dreamlike, fashion-forward world rendered with painterly beauty on iPhone. Observation point: the flowing fabric simulation, luminous landscapes, and intricately designed outfits that make styling feel like art.", "꿈결 같고 패션 중심의 세계를 회화적 아름다움으로 iPhone에 구현한 점에서 비주얼 및 그래픽 부문을 수상한 오픈월드 옷입히기 어드벤처다. 관찰 포인트: 스타일링을 예술처럼 느끼게 하는 흐르는 옷감 시뮬레이션, 빛나는 풍경, 정교하게 디자인된 의상."],
"Is This Seat Taken?": ["A cozy puzzle game honored for Delight and Fun for turning the simple act of seating quirky characters into charming, satisfying brain-teasers. Observation point: the warm character personalities and gentle aha-moments as you arrange everyone to their preferences.", "괴짜 캐릭터들의 자리 배치라는 단순한 행위를 매력적이고 만족스러운 두뇌 퍼즐로 바꿔 환희와 재미 부문을 수상한 아늑한 퍼즐 게임이다. 관찰 포인트: 모두를 취향에 맞게 배치할 때 찾아오는 따뜻한 캐릭터 개성과 잔잔한 깨달음의 순간."],
"Katha Room": ["An app recognized for Social Impact for nurturing storytelling, culture, and learning, rooted in an Indian creative tradition. Observation point: its thoughtfully crafted, culturally grounded content designed to bring stories and shared heritage to a wider audience.", "인도의 창작 전통에 뿌리를 두고 스토리텔링, 문화, 배움을 길러 낸 점에서 사회적 영향력 부문을 수상한 앱이다. 관찰 포인트: 이야기와 공동의 유산을 더 넓은 사용자에게 전하도록 정성껏 만든 문화 기반 콘텐츠."],
"Kimono Cats": ["A lighthearted game awarded for Interaction for its playful, tactile festival-date gameplay. Observation point: the simple, satisfying touch interactions of playing carnival games and dressing up cats that make moment-to-moment play feel breezy and responsive.", "장난기 넘치고 촉각적인 축제 데이트 플레이로 인터랙션 부문을 수상한 가벼운 게임이다. 관찰 포인트: 매 순간의 플레이를 산뜻하고 반응성 있게 만드는, 축제 게임을 즐기고 고양이를 꾸미는 단순하고 만족스러운 터치 조작."],
"Klima": ["A climate app honored for Social Impact for translating personal carbon footprints into clear, motivating action. Observation point: the friendly footprint calculator and offset pathways that make environmental responsibility feel concrete and achievable.", "개인의 탄소 발자국을 명확하고 동기를 부여하는 행동으로 옮긴 점에서 사회적 영향력 부문을 수상한 기후 앱이다. 관찰 포인트: 환경적 책임을 구체적이고 달성 가능하게 느끼게 하는 친근한 탄소 발자국 계산기와 상쇄 방안."],
"Knotwords": ["A word-logic puzzle game awarded for Delight and Fun for distilling crossword and Sudoku-style deduction into an elegant, addictive daily ritual. Observation point: the clever interplay of letter tiles and grid constraints that delivers a clean, deeply satisfying aha with every solve.", "크로스워드와 스도쿠식 추론을 우아하고 중독성 있는 매일의 의식으로 압축해 환희와 재미 부문을 수상한 단어 논리 퍼즐 게임이다. 관찰 포인트: 풀 때마다 깔끔하고 깊은 깨달음을 주는 글자 타일과 격자 제약의 영리한 상호작용."],
"LEGO Star Wars: Castaways": ["A social adventure awarded for Visuals and Graphics for bringing the LEGO Star Wars universe to life with crisp, toy-perfect rendering on Apple platforms. Observation point: the glossy plastic brick surfaces, expressive minifigure animation, and detailed dioramas that nail the tactile LEGO look.", "LEGO 스타워즈 세계를 선명하고 장난감처럼 완벽한 렌더링으로 Apple 기기에 구현한 점에서 비주얼 및 그래픽 부문을 수상한 소셜 어드벤처다. 관찰 포인트: 촉각적인 레고 질감을 완벽히 살린 광택 나는 플라스틱 블록 표면, 표현력 있는 미니피겨 애니메이션, 정교한 디오라마."],
"Land of Livia": ["A strategy game recognized for Inclusivity for welcoming a broad range of players across iPhone, iPad, Mac, and Vision Pro. Observation point: its accessible, flexible controls and adaptable difficulty that open thoughtful strategy play to many skill levels and devices.", "iPhone, iPad, Mac, Vision Pro를 아우르며 폭넓은 플레이어를 포용한 점에서 포용성 부문을 수상한 전략 게임이다. 관찰 포인트: 다양한 실력대와 기기에 사려 깊은 전략 플레이를 열어 주는 접근성 높고 유연한 조작과 적응형 난이도."],
"League of Legends: Wild Rift": ["A mobile MOBA awarded for Innovation for re-engineering the PC esports experience into a precise, fast touch game built for phones. Observation point: the dual-stick control scheme and reworked maps and abilities that translate competitive depth into intuitive mobile play.", "PC e스포츠 경험을 폰에 맞춘 정밀하고 빠른 터치 게임으로 재설계한 점에서 혁신 부문을 수상한 모바일 MOBA다. 관찰 포인트: 경쟁의 깊이를 직관적인 모바일 플레이로 옮긴 듀얼 스틱 조작 체계와 새로 다듬은 맵·스킬."],
"Letter Rooms": ["A word puzzle game honored for Inclusivity for being built from the ground up around accessibility, especially for blind and low-vision players. Observation point: its full VoiceOver support and audio-first design that make wordplay genuinely playable without sight.", "특히 시각 장애 플레이어를 위해 처음부터 접근성을 중심으로 설계된 점에서 포용성 부문을 수상한 단어 퍼즐 게임이다. 관찰 포인트: 시각 없이도 단어 놀이를 온전히 즐길 수 있게 하는 완전한 VoiceOver 지원과 오디오 우선 설계."],
"Lies of P": ["A soulslike action game awarded for Visuals and Graphics for its sumptuous Belle Époque art direction running on Mac. Observation point: the lavish, decaying city of Krat, intricate puppet and costume design, and moody lighting that deliver console-grade fidelity.", "Mac에서 구현된 호화로운 벨 에포크 아트 디렉션으로 비주얼 및 그래픽 부문을 수상한 소울라이크 액션 게임이다. 관찰 포인트: 콘솔급 완성도를 보여주는 화려하게 쇠락한 도시 크라트, 정교한 인형과 의상 디자인, 분위기 있는 조명."],
"Little Nightmares": ["A horror-puzzle platformer recognized for Interaction for translating its tense, tactile console gameplay to touch with finesse. Observation point: the responsive movement, grabbing, and stealth controls that preserve the dread and precision of navigating its oversized, sinister world.", "긴장감 있고 촉각적인 콘솔 플레이를 터치로 세련되게 옮긴 점에서 인터랙션 부문을 수상한 호러 퍼즐 플랫포머다. 관찰 포인트: 거대하고 음산한 세계를 헤쳐 나가는 공포와 정밀함을 살려 낸 반응성 높은 이동, 붙잡기, 잠입 조작."],
"Little Orpheus": ["A side-scrolling adventure awarded for Delight and Fun and Visuals and Graphics for its witty Cold-War-era tall tale and gorgeous, ever-shifting vistas. Observation point: the lushly painted prehistoric and subterranean worlds paired with charming, comedic narration that keeps the journey buoyant.", "재치 있는 냉전기 허풍담과 끊임없이 변하는 아름다운 풍경으로 환희와 재미, 비주얼 및 그래픽 부문을 수상한 횡스크롤 어드벤처다. 관찰 포인트: 여정을 경쾌하게 유지하는 매력적이고 코믹한 내레이션과 어우러진, 풍성하게 그려진 선사·지하 세계."],
"Looom": ["An iPad animation tool from the pre-category 2020 awards, celebrated for reinventing frame-by-frame animation as an intuitive, hands-on creative instrument. Observation point: the dual-wheel interface that lets you draw and loop animations directly with your fingers, making animation feel like play.", "부문 도입 이전인 2020년에 프레임 단위 애니메이션을 직관적이고 손으로 다루는 창작 도구로 재발명한 공로로 선정된 iPad 애니메이션 앱이다. 관찰 포인트: 손가락으로 직접 그리고 반복 재생할 수 있게 해 애니메이션을 놀이처럼 느끼게 하는 듀얼 휠 인터페이스."],
"Lost in Play": ["A point-and-click adventure awarded for Innovation for its cartoon-perfect, dialogue-free puzzle storytelling, here reaching Vision Pro. Observation point: the inventive, varied minigame puzzles and seamless animated world that feels like playing through a Saturday-morning cartoon.", "만화처럼 완벽하고 대사 없는 퍼즐 스토리텔링을 Vision Pro까지 확장한 점에서 혁신 부문을 수상한 포인트 앤 클릭 어드벤처다. 관찰 포인트: 토요일 아침 만화 속을 플레이하는 듯한 기발하고 다채로운 미니게임 퍼즐과 매끄러운 애니메이션 세계."],
"Loóna": ["A relaxation app awarded for Visuals and Graphics for transforming mindfulness into a soothing, beautiful nightly ritual. Observation point: the gorgeous interactive coloring scenes and ambient soundscapes that guide you visually toward calm before sleep.", "마음챙김을 차분하고 아름다운 밤의 의식으로 바꾼 점에서 비주얼 및 그래픽 부문을 수상한 릴랙세이션 앱이다. 관찰 포인트: 잠들기 전 시각적으로 평온함으로 이끄는 아름다운 인터랙티브 색칠 장면과 앰비언트 사운드스케이프."],
"Loóna: Cozy Puzzle Games": ["The relaxation experience reborn on Vision Pro and honored for Spatial Computing for wrapping calming puzzles in immersive surroundings. Observation point: how the soothing scenes extend into your physical space, using depth and ambience to create a restful spatial sanctuary.", "마음을 달래는 퍼즐을 몰입형 환경으로 감싸 Vision Pro에서 다시 태어난 점에서 공간 컴퓨팅 부문을 수상했다. 관찰 포인트: 깊이감과 분위기를 활용해 편안한 공간의 안식처를 만들며 차분한 장면이 실제 공간으로 확장되는 방식."],
"Lumy": ["A sun-tracking app honored for Delight and Fun for turning the daily arc of the sun into a beautiful, joyful experience. Observation point: the playful golden-hour and blue-hour visualizations and charming animations that make checking light conditions a pleasure.", "태양의 하루 궤적을 아름답고 즐거운 경험으로 바꾼 점에서 환희와 재미 부문을 수상한 태양 추적 앱이다. 관찰 포인트: 빛 상태를 확인하는 일을 즐겁게 만드는 골든아워·블루아워의 경쾌한 시각화와 매력적인 애니메이션."],
"MARVEL Future Revolution": ["An open-world action RPG awarded for Innovation for delivering a console-scale Marvel universe on mobile. Observation point: the ambitious 3D city environments, real-time superhero combat, and deep costume customization pushing the limits of mobile hardware.", "콘솔급 규모의 마블 세계를 모바일에 구현한 점에서 혁신 부문을 수상한 오픈월드 액션 RPG다. 관찰 포인트: 모바일 하드웨어의 한계를 밀어붙인 야심 찬 3D 도시 환경, 실시간 슈퍼히어로 전투, 깊이 있는 코스튬 커스터마이징."],
"MARVEL SNAP": ["Won for Innovation by reinventing the collectible card game for mobile: matches resolve in under three minutes on a single shared 3x4 board, and the standout observation point is the 'Location' system where ever-changing board zones rewrite the rules each turn. Its snappy, cinematic card variants and built-in deck-sharing show how a TCG can be rebuilt natively for the phone.", "혁신(Innovation) 부문 수상작으로, 수집형 카드 게임을 모바일에 맞게 재발명했다. 한 판이 3분 이내에 끝나고 공유된 3x4 보드 위에서 진행되며, 주목할 포인트는 매 턴 규칙을 바꿔버리는 '로케이션' 시스템이다. 경쾌하고 영화적인 카드 변형과 덱 공유 기능은 TCG를 폰에 맞게 새로 설계한 사례를 보여준다."],
"MD Clock": ["Recognized for Visuals and Graphics, this clock app treats timekeeping as a canvas, with the observation point being its meticulously rendered analog faces and typography that make a utilitarian function feel like a piece of art. Smooth animation and refined color work elevate a simple clock into a display-worthy visual object.", "비주얼 및 그래픽(Visuals and Graphics) 부문 수상작으로, 시간 표시를 하나의 캔버스처럼 다룬다. 주목할 점은 정교하게 렌더링된 아날로그 시계 페이스와 타이포그래피로, 실용적 기능을 예술 작품처럼 느끼게 한다. 매끄러운 애니메이션과 세련된 색감이 단순한 시계를 전시할 만한 시각적 오브제로 끌어올린다."],
"Me: A Kid's Diary by Tinybop": ["Awarded for Inclusivity because it gives young children a low-pressure, language-light way to express themselves through prompts, drawings, and audio rather than written text. The observation point is its open-ended, judgment-free prompt design that welcomes kids of varying ages, abilities, and reading levels into self-expression.", "포용성(Inclusivity) 부문 수상작으로, 어린아이들이 글이 아닌 질문, 그림, 음성으로 부담 없이 자신을 표현하게 해준다. 주목할 점은 정답이 없고 평가하지 않는 열린 질문 설계로, 나이와 능력, 읽기 수준이 제각각인 아이들을 자기표현의 장으로 자연스럽게 끌어들인다."],
"Meditate": ["Honored for Visuals and Graphics, this Indian meditation app pairs guided practice with serene, atmospheric visuals, with the observation point being how its calming color gradients and gentle motion on both iPhone and Watch reinforce the meditative state. The art direction makes the on-screen environment itself part of the relaxation.", "비주얼 및 그래픽(Visuals and Graphics) 부문 수상작으로, 인도에서 만든 이 명상 앱은 가이드 명상에 고요하고 분위기 있는 비주얼을 결합한다. 주목할 점은 iPhone과 Watch 양쪽에서 마음을 가라앉히는 색 그라데이션과 부드러운 움직임이 명상 상태를 강화하는 방식이다. 화면 속 환경 자체가 이완의 일부가 되도록 아트 디렉션을 구성했다."],
"Mela – Recipe Manager": ["Won for Interaction through cooking-focused design that anticipates how hands and attention move in a kitchen, with the observation point being its cook-mode that keeps the screen awake and lets you step through recipe stages with minimal taps. Seamless syncing across iPhone, iPad, and Mac plus web-import parsing make capturing and following recipes feel effortless.", "인터랙션(Interaction) 부문 수상작으로, 주방에서 손과 시선이 어떻게 움직이는지를 예측한 요리 중심 설계가 돋보인다. 주목할 점은 화면을 켜둔 채 최소한의 탭으로 조리 단계를 넘길 수 있는 쿡 모드다. iPhone·iPad·Mac 간 매끄러운 동기화와 웹 레시피 자동 파싱이 레시피 저장과 따라 하기를 수월하게 만든다."],
"Metaballs": ["Awarded for Delight and Fun, this app turns the classic gooey 'metaball' effect into a tactile toy, and the observation point is the satisfying, physics-like way blobs merge and split under your fingers or in Vision Pro space. Its playful, hypnotic interactivity exists purely to spark joy.", "재미와 즐거움(Delight and Fun) 부문 수상작으로, 고전적인 끈적한 '메타볼' 효과를 손으로 만지는 장난감으로 바꿔놓았다. 주목할 점은 손가락이나 Vision Pro 공간에서 방울들이 합쳐지고 갈라지는 물리적이고 만족스러운 움직임이다. 장난스럽고 최면적인 상호작용 자체가 오직 즐거움을 위해 존재한다."],
"Mission to Mars AR": ["Recognized for Visuals and Graphics, this app uses augmented reality to render Mars missions and spacecraft at convincing scale in your room, with the observation point being the detailed, well-lit 3D models that hold up under close inspection. The graphical fidelity makes space exploration feel tangible and present.", "비주얼 및 그래픽(Visuals and Graphics) 부문 수상작으로, 증강현실을 활용해 화성 탐사와 우주선을 방 안에 설득력 있는 크기로 렌더링한다. 주목할 점은 가까이 들여다봐도 흐트러지지 않는 정교하고 빛 표현이 좋은 3D 모델이다. 그래픽 완성도가 우주 탐사를 손에 잡힐 듯 생생하게 만든다."],
"Moises": ["Won for Innovation by using AI to separate any song into isolated vocal and instrument tracks, with the observation point being its on-device-grade stem separation plus pitch and tempo shifting that turn a finished recording into a practice tool for musicians. It applies machine learning to a problem that once required a full studio.", "혁신(Innovation) 부문 수상작으로, AI를 이용해 어떤 곡이든 보컬과 악기 트랙으로 분리한다. 주목할 점은 음원을 보컬·악기별 스템으로 나누고 음정과 템포까지 바꿔, 완성된 녹음을 연주자의 연습 도구로 만드는 기능이다. 한때 스튜디오가 필요했던 작업을 머신러닝으로 해결했다."],
"Moncage": ["Awarded for Delight and Fun, this puzzle game hides its joy in a single cube whose six faces are distinct dioramas, and the observation point is the clever moment when you align scenes across two faces to connect impossible spaces. Its surprising spatial trickery and cozy hand-crafted art deliver a steady stream of 'aha' delight.", "재미와 즐거움(Delight and Fun) 부문 수상작으로, 여섯 면이 각기 다른 디오라마인 하나의 큐브 안에 즐거움을 숨겨둔 퍼즐 게임이다. 주목할 점은 두 면의 장면을 정렬해 불가능한 공간을 연결하는 영리한 순간이다. 의외의 공간적 트릭과 정성 들인 아기자기한 아트가 끊임없는 '아하' 순간을 선사한다."],
"Moonlitt: Moon Phase Tracker": ["Won for Interaction by making lunar tracking feel hands-on across the full Apple ecosystem, with the observation point being how fluidly its moon visuals and data adapt across iPhone, iPad, Mac, Vision Pro, and Watch. Thoughtful, platform-native controls let you explore phases and timing with a natural, responsive touch.", "인터랙션(Interaction) 부문 수상작으로, 애플 생태계 전반에서 달 추적을 직접 다루는 경험으로 만들었다. 주목할 점은 iPhone·iPad·Mac·Vision Pro·Watch에 걸쳐 달의 비주얼과 데이터가 유연하게 적응하는 방식이다. 각 플랫폼에 맞춘 세심한 컨트롤이 달의 위상과 시각을 자연스럽고 반응 좋은 손길로 탐색하게 해준다."],
"Museum Alive": ["Recognized for Innovation, this app uses AR to bring museum-style natural-history subjects to life in your space, narrated by David Attenborough, with the observation point being how it blends volumetric/3D creatures with real-world placement and storytelling. It applies emerging AR techniques to make educational content immersive.", "혁신(Innovation) 부문 수상작으로, AR을 활용해 박물관식 자연사 전시물을 사용자의 공간에 살아 움직이게 하며 데이비드 애튼버러의 내레이션을 더한다. 주목할 점은 입체적인 생물과 현실 공간 배치, 그리고 스토리텔링을 결합하는 방식이다. 떠오르는 AR 기술로 교육 콘텐츠를 몰입감 있게 만든다."],
"NBA": ["Won for Spatial Computing by reimagining live basketball for Vision Pro, with the observation point being its multi-view layout that floats game feeds, stats, and league data as spatial windows around you. It uses the headset's room-scale canvas to let fans build a personal courtside command center.", "공간 컴퓨팅(Spatial Computing) 부문 수상작으로, Vision Pro를 위해 라이브 농구를 재구성했다. 주목할 점은 경기 중계와 스탯, 리그 데이터를 사용자 주변에 공간 창으로 띄우는 멀티뷰 레이아웃이다. 헤드셋의 공간 캔버스를 활용해 팬이 개인 코트사이드 관제 센터를 꾸리게 해준다."],
"NBA: Live Games & Scores": ["Awarded for Innovation on Vision Pro, this app pushes live sports viewing forward with the observation point being its immersive, spatially arranged broadcast and real-time data presentation tailored to the headset. It treats a basketball game as a reconfigurable spatial experience rather than a flat stream.", "Vision Pro용 혁신(Innovation) 부문 수상작으로, 라이브 스포츠 시청을 한 단계 발전시켰다. 주목할 점은 헤드셋에 맞춰 공간적으로 배치된 몰입형 중계와 실시간 데이터 표현이다. 농구 경기를 평면 스트림이 아니라 자유롭게 재구성 가능한 공간 경험으로 다룬다."],
"NYT Games": ["Honored for Delight and Fun, this suite gathers Wordle, the Crossword, Spelling Bee, and Connections into one polished daily-puzzle home, and the observation point is the crisp typography, satisfying tile animations, and celebratory streak feedback that make each solve rewarding. Small touches of craft turn habitual puzzling into a daily pleasure.", "재미와 즐거움(Delight and Fun) 부문 수상작으로, Wordle·크로스워드·Spelling Bee·Connections를 하나의 잘 다듬어진 일일 퍼즐 공간에 모았다. 주목할 점은 또렷한 타이포그래피, 만족스러운 타일 애니메이션, 그리고 연속 기록을 축하하는 피드백으로 매 정답을 보람차게 만든다는 점이다. 작은 디테일들이 습관적인 퍼즐 풀이를 매일의 즐거움으로 바꾼다."],
"NaadSadhana": ["Won for Innovation as an AI-powered companion for Indian classical music, with the observation point being how it listens to a vocalist and generates a matching live accompaniment, including tanpura, tabla, and auto-tuned arrangements. It applies real-time audio AI to a deeply traditional art form.", "혁신(Innovation) 부문 수상작으로, 인도 고전 음악을 위한 AI 동반자 앱이다. 주목할 점은 보컬을 듣고 탄푸라, 타블라, 자동 보정 편곡을 포함한 실시간 반주를 생성하는 기능이다. 실시간 오디오 AI를 깊은 전통 예술에 적용했다."],
"Navi": ["Awarded for Inclusivity, this app provides real-time captions and transcription to help deaf and hard-of-hearing users follow conversations and video calls, with the observation point being its live captioning that makes spoken content accessible on the spot. It directly broadens who can participate in everyday communication.", "포용성(Inclusivity) 부문 수상작으로, 실시간 자막과 전사로 청각 장애인이 대화와 영상 통화를 따라갈 수 있도록 돕는다. 주목할 점은 말소리 콘텐츠를 그 자리에서 접근 가능하게 만드는 라이브 자막 기능이다. 일상적 소통에 참여할 수 있는 사람의 범위를 직접 넓힌다."],
"Neva": ["Won jointly for Social Impact and Visuals and Graphics: this painterly action-adventure follows a young woman and her wolf companion through a dying world, and the observation point is its hand-painted, watercolor-like environments that shift with the seasons. The art carries an emotional, ecological theme about loss and growth, uniting visual beauty with meaningful message.", "사회적 영향(Social Impact)과 비주얼 및 그래픽(Visuals and Graphics)을 함께 수상했다. 한 소녀와 늑대 동료가 스러져 가는 세계를 여행하는 회화적 액션 어드벤처로, 주목할 점은 계절에 따라 변하는 수채화 같은 손그림 배경이다. 이 아트가 상실과 성장이라는 정서적·생태적 주제를 담아 시각적 아름다움과 의미 있는 메시지를 하나로 묶는다."],
"Noted.": ["Awarded for Inclusivity, this note-taking app records audio and syncs it with typed notes so users can revisit exactly what was said, with the observation point being how this time-linked transcription supports people who process information differently or who can't capture everything by hand. It makes meetings and lectures more accessible.", "포용성(Inclusivity) 부문 수상작으로, 오디오를 녹음해 입력한 메모와 동기화함으로써 사용자가 실제로 무슨 말이 오갔는지 정확히 되짚게 해준다. 주목할 점은 시간과 연동된 이 전사 기능이 정보를 다르게 처리하거나 손으로 모든 것을 받아 적기 어려운 사람들을 지원한다는 점이다. 회의와 강의를 더 접근하기 쉽게 만든다."],
"Nova": ["Won for Interaction as a Mac code editor built by Panic with a deep respect for native macOS feel, and the observation point is its fast, fluid editing, integrated tools, and snappy keyboard- and trackpad-driven workflow. Its responsiveness and considered controls make developer interaction feel effortless and distinctly Mac-like.", "인터랙션(Interaction) 부문 수상작으로, Panic이 네이티브 macOS 감각을 깊이 존중하며 만든 Mac 코드 에디터다. 주목할 점은 빠르고 유연한 편집, 통합된 도구, 그리고 키보드와 트랙패드로 매끄럽게 이어지는 작업 흐름이다. 반응성과 잘 설계된 컨트롤이 개발자의 상호작용을 수월하고 확실히 Mac답게 만든다."],
"Odio": ["Recognized for Innovation, this ambient soundscape app lets users layer and blend atmospheric sounds into custom audio environments, with the observation point being its inventive, gesture-driven mixing interface and beautifully designed sound scenes. It rethinks how a relaxation app can be both a creative tool and an aesthetic experience.", "혁신(Innovation) 부문 수상작으로, 분위기 있는 사운드를 겹치고 섞어 나만의 오디오 환경을 만들게 해주는 앰비언트 사운드스케이프 앱이다. 주목할 점은 독창적인 제스처 기반 믹싱 인터페이스와 아름답게 디자인된 사운드 장면이다. 휴식용 앱이 창작 도구이자 미적 경험이 될 수 있음을 다시 보여준다."],
"Opal": ["Won for Social Impact, this screen-time and focus app helps people reclaim attention from distracting apps, with the observation point being its friction-adding 'block' sessions and insightful focus stats that make digital habits visible and changeable. It uses thoughtful design to improve users' real-world wellbeing.", "사회적 영향(Social Impact) 부문 수상작으로, 주의를 빼앗는 앱으로부터 집중력을 되찾도록 돕는 스크린타임·집중 앱이다. 주목할 점은 사용을 의도적으로 어렵게 만드는 차단 세션과, 디지털 습관을 눈에 보이고 바꿀 수 있게 하는 통찰력 있는 집중 통계다. 사려 깊은 디자인으로 사용자의 실제 삶의 질을 개선한다."],
"Overboard!": ["Awarded for Delight and Fun, this inkle narrative game casts you as a 1930s murderer trying to get away with it aboard an ocean liner, and the observation point is its witty, branching, replayable writing that rewards experimentation across short runs. Sharp dialogue and a playful inverted-whodunit premise make every playthrough a treat.", "재미와 즐거움(Delight and Fun) 부문 수상작으로, inkle이 만든 내러티브 게임에서 플레이어는 1930년대 여객선 위에서 살인을 저지르고 빠져나가려는 인물이 된다. 주목할 점은 짧은 플레이마다 실험을 보상하는 재치 있고 분기하는 다회차 글쓰기다. 날카로운 대사와 뒤집힌 추리극이라는 장난스러운 설정이 매 플레이를 즐겁게 만든다."],
"PBJ — The Musical": ["Won for Innovation from Philipp Stollenmayer, this game retells a peanut-butter-and-jelly tale as a quirky interactive musical, with the observation point being its inventive fusion of rhythm, animation, and absurd humor into a form that defies easy genre labels. It pushes what a tiny indie game can be on iPhone.", "혁신(Innovation) 부문 수상작으로, Philipp Stollenmayer가 땅콩버터와 잼 이야기를 기발한 인터랙티브 뮤지컬로 풀어냈다. 주목할 점은 리듬, 애니메이션, 엉뚱한 유머를 장르로 규정하기 어려운 형태로 융합한 독창성이다. 작은 인디 게임이 iPhone에서 무엇이 될 수 있는지 그 경계를 넓힌다."],
"Passenger Assistance": ["Awarded for Inclusivity, this UK app lets disabled and older rail passengers book the help they need at stations directly from their phone, with the observation point being its accessible, low-stress booking flow built around real assistance needs. It removes a major barrier to independent travel.", "포용성(Inclusivity) 부문 수상작으로, 영국에서 장애인과 고령 철도 이용객이 역에서 필요한 도움을 폰으로 직접 예약하게 해준다. 주목할 점은 실제 지원 필요에 맞춰 설계된, 접근성 높고 부담 적은 예약 흐름이다. 독립적인 이동을 가로막던 큰 장벽을 없앤다."],
"Pawz": ["Won for Innovation on Vision Pro, this game brings a virtual pet into your real space, with the observation point being how it uses the headset's hand tracking and room awareness to let you interact with a creature that responds to your gestures and environment. It explores playful spatial companionship as a new interaction frontier.", "Vision Pro용 혁신(Innovation) 부문 수상작으로, 가상 반려동물을 현실 공간으로 데려온다. 주목할 점은 헤드셋의 손 추적과 공간 인식을 활용해, 제스처와 주변 환경에 반응하는 생명체와 상호작용하게 하는 방식이다. 장난스러운 공간적 교감을 새로운 상호작용의 영역으로 탐구한다."],
"Pickle Pro": ["Won for Innovation on Vision Pro from Resolution Games, this pickleball game uses the headset to turn your real room into a court, with the observation point being its precise hand and motion tracking that makes swinging a virtual paddle feel physically credible. It demonstrates convincing spatial sports gameplay.", "Vision Pro용 혁신(Innovation) 부문 수상작으로, Resolution Games가 만든 이 피클볼 게임은 헤드셋으로 현실의 방을 코트로 바꾼다. 주목할 점은 가상 패들을 휘두르는 동작을 물리적으로 설득력 있게 만드는 정밀한 손·동작 추적이다. 공간형 스포츠 게임플레이의 완성도를 입증한다."],
"Pine Hearts": ["Awarded for Inclusivity, this cozy adventure tells a heartfelt story while keeping its puzzles and controls gentle and approachable, with the observation point being its relaxed, accessible design that welcomes players regardless of skill or gaming experience. Its warm, low-barrier play makes an emotional story open to everyone.", "포용성(Inclusivity) 부문 수상작으로, 따뜻한 이야기를 들려주면서도 퍼즐과 조작을 부드럽고 다가가기 쉽게 유지한다. 주목할 점은 실력이나 게임 경험과 무관하게 누구나 즐길 수 있게 한 여유롭고 접근성 높은 디자인이다. 부담 없는 플레이가 정서적인 이야기를 모두에게 열어준다."],
"Play": ["Won for Innovation, this app is a tool for saving, organizing, and queuing videos to watch later, with the observation point being its smart, frictionless capture flow and cross-device sync between iPhone and Mac that rethinks the humble watch-list. It applies clever design to make managing a video backlog genuinely pleasant.", "혁신(Innovation) 부문 수상작으로, 나중에 볼 영상을 저장하고 정리하고 대기열에 담는 도구다. 주목할 점은 똑똑하고 매끄러운 저장 흐름과 iPhone·Mac 간 동기화로, 평범한 시청 목록을 다시 설계한다는 점이다. 영리한 디자인으로 쌓여가는 영상 관리를 진짜로 즐겁게 만든다."],
"Please, Touch The Artwork": ["Awarded for Delight and Fun, this minimalist puzzle game invites you to interact with abstract art inspired by Mondrian, and the observation point is the gentle, tactile satisfaction of tapping and sliding colored blocks to bring the canvas to life. Its calm, charming interactivity turns art appreciation into pure play.", "재미와 즐거움(Delight and Fun) 부문 수상작으로, 몬드리안에서 영감을 받은 추상 예술을 직접 만지며 상호작용하게 하는 미니멀 퍼즐 게임이다. 주목할 점은 색색의 블록을 두드리고 밀어 캔버스를 살아나게 하는 부드럽고 촉각적인 만족감이다. 차분하고 매력적인 상호작용이 예술 감상을 순수한 놀이로 바꾼다."],
"Pocket Card Jockey: Ride On!": ["Awarded for Delight and Fun from GAME FREAK, this game mashes up solitaire and horse racing into an irresistibly weird package, with the observation point being how each round of card-clearing literally powers your horse around the track. Its joyful absurdity and tight, satisfying loop make it endlessly charming.", "재미와 즐거움(Delight and Fun) 부문 수상작으로, GAME FREAK이 솔리테어와 경마를 거부할 수 없이 기묘하게 뒤섞었다. 주목할 점은 카드를 정리하는 매 라운드가 말이 트랙을 도는 동력이 되는 방식이다. 유쾌한 엉뚱함과 짜임새 있고 만족스러운 반복 구조가 끝없는 매력을 만든다."],
"Pok Pok Playroom": ["Won for Delight and Fun, this children's app is a digital Montessori-style toy box full of open-ended activities, and the observation point is its warm, hand-illustrated art and consequence-free play that rewards curiosity without timers, scores, or ads. Every interaction is crafted to delight young children and invite exploration.", "재미와 즐거움(Delight and Fun) 부문 수상작으로, 정답이 없는 활동으로 가득한 몬테소리식 디지털 장난감 상자 같은 아동용 앱이다. 주목할 점은 따뜻한 손그림 아트와, 타이머·점수·광고 없이 호기심을 보상하는 자유로운 놀이다. 모든 상호작용이 어린아이를 즐겁게 하고 탐색을 유도하도록 정성껏 만들어졌다."],
"Poolsuite FM": ["Won for Delight and Fun, this retro-styled internet radio app delivers an endless summer through its design, with the observation point being its lo-fi, nostalgic 80s/90s interface, playful skeuomorphic touches, and curated vacation-vibe playlists. Pure mood and personality make it a joy to simply have open.", "재미와 즐거움(Delight and Fun) 부문 수상작으로, 복고풍 인터넷 라디오 앱이 디자인만으로 끝나지 않는 여름을 선사한다. 주목할 점은 로파이하고 향수를 자극하는 80~90년대풍 인터페이스, 장난스러운 스큐어모픽 디테일, 그리고 휴가 분위기로 큐레이션된 플레이리스트다. 순수한 무드와 개성만으로도 그저 켜두는 것이 즐겁다."],
"PowerWash Simulator": ["Awarded for Delight and Fun, this oddly soothing game lets you blast grime off objects with a power washer, and the observation point is the deeply satisfying contrast of dirty-to-clean surfaces and the meditative, no-pressure cleaning loop now spanning iPhone, Mac, TV, and Vision Pro. Its simple, tactile gratification is the whole appeal.", "재미와 즐거움(Delight and Fun) 부문 수상작으로, 고압 세척기로 때를 벗겨내는 묘하게 마음이 편안해지는 게임이다. 주목할 점은 더러운 표면이 깨끗해지는 강렬한 대비와, 이제 iPhone·Mac·TV·Vision Pro로 확장된 압박 없는 명상적 청소 루프다. 단순하고 촉각적인 만족감 그 자체가 매력의 전부다."],
