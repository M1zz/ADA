<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Design Awards Archive (2020–2026)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,300;1,14..32,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --surface-hi:#f8fafc;
    --line:#e2e8f0;
    --line-soft:#f1f5f9;
    --text:#0f172a;
    --muted:#64748b;
    --muted-dim:#94a3b8;
    --accent:#0ea5e9;
    --accent-dim:#0284c7;

    --c-delight:#f43f5e;
    --c-inclusivity:#10b981;
    --c-innovation:#3b82f6;
    --c-interaction:#8b5cf6;
    --c-social:#ec4899;
    --c-visuals:#f59e0b;
    --c-spatial:#06b6d4;
    --c-uncat:#6b7280;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    min-height:100vh;
    font-feature-settings:"cv02","cv03","cv04","cv11";
  }
  a{color:inherit;text-decoration:none}

  /* ── Header ── */
  header{max-width:1200px;margin:0 auto;padding:72px 32px 40px;position:relative}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);
    background:var(--line-soft);border:1px solid var(--line);
    border-radius:999px;padding:5px 12px;margin-bottom:28px;
  }
  .eyebrow-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
  h1{
    font-size:clamp(40px,6.5vw,80px);
    font-weight:800;
    line-height:1;
    letter-spacing:-0.04em;
    margin-bottom:20px;
    color:var(--text);
  }
  h1 .it{
    font-style:italic;
    font-weight:300;
    color:var(--accent);
    letter-spacing:-0.03em;
  }
  .lede{
    font-size:clamp(15px,1.6vw,17px);
    color:var(--muted);
    max-width:580px;
    line-height:1.75;
    font-weight:400;
  }
  .stats{
    display:flex;flex-wrap:wrap;gap:0;
    margin-top:40px;
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    width:fit-content;
  }
  .stat{
    padding:20px 32px;
    border-right:1px solid var(--line);
  }
  .stat:last-child{border-right:none}
  .stat .n{
    font-size:30px;font-weight:800;line-height:1;
    letter-spacing:-0.03em;color:var(--text);
  }
  .stat .l{font-size:12px;color:var(--muted);margin-top:5px;font-weight:500}

  /* ── Lang toggle ── */
  .lang-toggle{
    position:absolute;top:72px;right:32px;
    display:inline-flex;
    background:var(--line-soft);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .lang-btn{
    padding:5px 14px;cursor:pointer;background:transparent;border:none;
    font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.04em;
    color:var(--muted);transition:all .15s;border-radius:999px;
  }
  .lang-btn.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .lang-btn:hover:not(.active){color:var(--text);}

  /* ── Controls ── */
  .controls{
    position:sticky;top:0;z-index:40;
    background:rgba(255,255,255,0.88);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
    padding:12px 0 14px;
  }
  .controls-inner{max-width:1200px;margin:0 auto;padding:0 32px}
  .filter-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
  .filter-row:last-child{margin-bottom:0}
  .flabel{
    font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted-dim);width:68px;flex-shrink:0;font-weight:600;
  }
  .chip{
    font-family:inherit;font-size:12.5px;font-weight:500;
    color:var(--muted);background:transparent;
    border:1px solid var(--line);border-radius:999px;
    padding:5px 13px;cursor:pointer;transition:all .14s;
    white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
  }
  .chip:hover{color:var(--text);border-color:var(--muted-dim);background:var(--line-soft)}
  .chip.active{
    color:#fff;background:var(--text);border-color:var(--text);font-weight:600;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .search-wrap{position:relative;margin-left:auto;flex-grow:1;max-width:260px;min-width:160px}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.4}
  #search{
    width:100%;font-family:inherit;font-size:13px;
    color:var(--text);background:var(--surface);
    border:1px solid var(--line);border-radius:999px;
    padding:7px 14px 7px 34px;outline:none;
    transition:border-color .14s, box-shadow .14s;
  }
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,165,233,.1)}
  #search::placeholder{color:var(--muted-dim)}
  .toggle{
    display:inline-flex;align-items:center;gap:8px;
    cursor:pointer;font-size:12.5px;color:var(--muted);user-select:none;
  }
  .toggle .sw{
    width:36px;height:20px;border-radius:999px;
    background:var(--line);position:relative;transition:background .16s;flex-shrink:0;
  }
  .toggle .sw::after{
    content:"";position:absolute;
    width:14px;height:14px;border-radius:50%;
    background:#fff;top:3px;left:3px;
    transition:all .16s;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
  }
  .toggle.on .sw{background:var(--accent)}
  .toggle.on .sw::after{left:19px}
  .toggle.on{color:var(--text)}

  /* ── Main ── */
  main{max-width:1200px;margin:0 auto;padding:28px 32px 100px}
  .meta-line{font-size:12.5px;color:var(--muted-dim);margin-bottom:24px;font-weight:500}
  .meta-line b{color:var(--text);font-weight:700}

  .yeargroup{margin-bottom:52px}
  .yearhead{
    display:flex;align-items:center;gap:12px;
    margin-bottom:18px;padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .yearhead .yr{
    font-size:36px;font-weight:800;letter-spacing:-0.04em;color:var(--text);line-height:1;
  }
  .yearhead .yc{
    font-size:12px;color:var(--muted-dim);font-weight:500;
    background:var(--line-soft);border:1px solid var(--line);
    border-radius:6px;padding:3px 8px;
  }

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

  /* ── Card ── */
  .card{
    position:relative;background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px 20px 18px;
    overflow:hidden;display:flex;flex-direction:column;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .card::before{
    content:"";position:absolute;
    left:0;top:0;bottom:0;width:3px;
    background:var(--ac,var(--accent));
    border-radius:2px 0 0 2px;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 32px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04);
    border-color:var(--muted-dim);
  }

  .card-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
  .icon{
    width:54px;height:54px;border-radius:14px;flex-shrink:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);background:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  .icon img{width:100%;height:100%;object-fit:cover;display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .icon .mono{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;color:#fff;letter-spacing:-.01em;
    background:linear-gradient(135deg, var(--ac,var(--accent)), color-mix(in srgb, var(--ac,var(--accent)) 70%, #000 20%));
  }
  .head-text{min-width:0;flex:1}
  .head-text h3{
    font-weight:700;font-size:16px;line-height:1.25;
    letter-spacing:-0.02em;margin-bottom:3px;
    word-break:break-word;
  }
  .head-text h3 a:hover{color:var(--accent)}
  .dev{font-size:12px;color:var(--muted);font-weight:400}
  .dev .country{color:var(--muted-dim)}

  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
  .badge{
    font-size:10px;font-weight:600;letter-spacing:.02em;
    padding:3px 8px;border-radius:6px;white-space:nowrap;
  }
  .badge.cat{
    color:var(--ac,var(--accent));
    background:color-mix(in srgb,var(--ac,var(--accent)) 10%, #fff);
    border:1px solid color-mix(in srgb,var(--ac,var(--accent)) 22%, #fff);
  }
  .badge.type{color:var(--muted);background:var(--line-soft);border:1px solid var(--line)}
  .badge.award{display:inline-flex;align-items:center;gap:4px}
  .badge.award.winner{
    color:#92400e;
    background:#fef3c7;
    border:1px solid #fde68a;
  }
  .badge.award.finalist{color:var(--muted);background:var(--line-soft);border:1px solid var(--line)}

  .plats{font-size:11px;color:var(--muted-dim);margin-top:auto;padding-top:12px;font-weight:400}
  .dl{
    margin-top:12px;display:inline-flex;align-items:center;gap:5px;
    font-size:12px;font-weight:600;
    color:var(--text);
    border:1px solid var(--line);
    border-radius:8px;padding:6px 11px;
    align-self:flex-start;transition:all .14s;
    background:#fff;
  }
  .card .dl:hover{background:var(--text);color:#fff;border-color:var(--text)}
  .dl svg{transition:transform .14s}
  .card .dl:hover svg{transform:translate(1px,-1px)}

  .empty{text-align:center;padding:80px 20px;color:var(--muted-dim)}
  .empty .big{font-size:24px;font-weight:700;color:var(--muted);margin-bottom:8px;letter-spacing:-0.02em}
  .empty .sub{font-size:14px}

  /* ── Footer ── */
  footer{
    max-width:1200px;margin:0 auto;
    padding:28px 32px 64px;
    border-top:1px solid var(--line);
    color:var(--muted-dim);font-size:12px;line-height:1.9;
  }
  footer a{color:var(--accent-dim);text-decoration:underline;text-underline-offset:2px}

  /* ── Mobile ── */
  @media (max-width:600px){
    header{padding:52px 20px 32px}
    .lang-toggle{top:52px;right:20px}
    .controls-inner,main,footer{padding-left:20px;padding-right:20px}
    .flabel{width:100%;margin-bottom:2px}
    .search-wrap{margin-left:0;max-width:none}
    .grid{grid-template-columns:1fr}
    .stats{flex-direction:column;width:100%}
    .stat{border-right:none;border-bottom:1px solid var(--line)}
    .stat:last-child{border-bottom:none}
    .stat{padding:16px 20px}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow"><span class="eyebrow-dot"></span>Apple Design Awards · 2020–2026</div>
  <h1 id="mainTitle"></h1>
  <p class="lede" id="mainLede"></p>
  <div class="stats">
    <div class="stat"><div class="n" id="stWin">–</div><div class="l" id="stWinLabel"></div></div>
    <div class="stat"><div class="n" id="stFin">–</div><div class="l" id="stFinLabel"></div></div>
    <div class="stat"><div class="n">7</div><div class="l" id="stYearsLabel"></div></div>
    <div class="stat"><div class="n">7</div><div class="l" id="stCatsLabel"></div></div>
  </div>
  <div class="lang-toggle" aria-label="Language">
    <button class="lang-btn active" id="btnEn" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="btnKo" onclick="setLang('ko')">한국어</button>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <div class="filter-row">
      <span class="flabel" id="labelYear"></span>
      <div id="yearChips" class="chips"></div>
    </div>
    <div class="filter-row">
      <span class="flabel" id="labelCat"></span>
      <div id="catChips" class="chips"></div>
    </div>
    <div class="filter-row">
      <span class="flabel" id="labelType"></span>
      <button class="chip type active" data-type="all" id="chipAll"></button>
      <button class="chip type" data-type="app" id="chipApp"></button>
      <button class="chip type" data-type="game" id="chipGame"></button>
      <label class="toggle" id="finToggle" style="margin-left:14px">
        <span class="sw"></span><span id="finToggleLabel"></span>
      </label>
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="text" autocomplete="off">
      </div>
    </div>
  </div>
</div>

<main>
  <div class="meta-line" id="metaLine"></div>
  <div id="results"></div>
</main>

<footer id="mainFooter"></footer>

<script>
// ─── i18n ────────────────────────────────────────────────────────────────────
const STRINGS = {
  en: {
    title: 'ADA <span class="it">Winners</span><br>Archive',
    lede: 'The Apple Design Awards recognize apps and games that reflect excellence in design, innovation, and technology. Browse winners and finalists from 2020 to 2026 by category, year, and platform. App icons and App Store links are included.',
    statWin: 'Winners',
    statFin: 'Finalists',
    statYears: 'Years',
    statCats: 'Categories',
    labelYear: 'Year',
    labelCat: 'Category',
    labelType: 'Type',
    all: 'All',
    app: 'App',
    game: 'Game',
    inclFinalists: 'Include Finalists',
    searchPlaceholder: 'Search apps / developers…',
    metaWithFin: (total, win, fin) => `Total <b>${total}</b> — Winners <b>${win}</b> · Finalists <b>${fin}</b>`,
    metaWinOnly: (win) => `<b>${win}</b> Winner${win !== 1 ? 's' : ''}`,
    yearNote2020: 'Pre-category era · 8 apps',
    yearNote: (cats, items) => `${cats} categories · ${items} apps`,
    noResults: 'No results',
    noResultsSub: 'Try a different combination of filters.',
    awardWinner: 'Winner',
    awardFinalist: 'Finalist',
    typeApp: 'App',
    typeGame: 'Game',
    dlBtn: 'App Store',
    footer: `Source: Apple Developer official <a href="https://developer.apple.com/design/awards/" target="_blank" rel="noopener">Apple Design Awards</a> page — data from 2020 to 2026.<br>
App icons are loaded live from the Apple iTunes API (internet connection required). Apps removed from the store are shown with an initial icon.
2020 selected 8 apps without category distinction, labeled as "Uncategorized". The app/game split for 2021–2022 reflects the nature of each work (official distinction began in 2023). Download links point to the US App Store; availability may vary by region.`,
  },
  ko: {
    title: '역대 ADA <span class="it">수상작</span><br>아카이브',
    lede: '애플이 매년 WWDC에서 디자인의 혁신성·독창성·기술적 성취를 인정해 선정하는 Apple Design Awards. 2020년부터 2026년까지의 수상작과 파이널리스트를 카테고리·연도·플랫폼별로 정리했습니다. 앱 아이콘과 App Store 다운로드 링크가 함께 제공됩니다.',
    statWin: '수상작 (Winners)',
    statFin: '파이널리스트',
    statYears: '개 연도',
    statCats: '개 카테고리',
    labelYear: '연도',
    labelCat: '카테고리',
    labelType: '유형',
    all: '전체',
    app: '앱',
    game: '게임',
    inclFinalists: '파이널리스트 포함',
    searchPlaceholder: '앱 / 개발사 검색…',
    metaWithFin: (total, win, fin) => `총 <b>${total}</b>개 — 수상작 <b>${win}</b> · 파이널리스트 <b>${fin}</b>`,
    metaWinOnly: (win) => `총 <b>${win}</b>개 수상작`,
    yearNote2020: '카테고리 도입 전 · 8개 작품',
    yearNote: (cats, items) => `${cats}개 카테고리 · ${items}개 작품`,
    noResults: '결과가 없습니다',
    noResultsSub: '다른 필터 조합을 시도해 보세요.',
    awardWinner: '수상',
    awardFinalist: '파이널리스트',
    typeApp: '앱',
    typeGame: '게임',
    dlBtn: 'App Store',
    footer: `출처: Apple Developer 공식 <a href="https://developer.apple.com/design/awards/" target="_blank" rel="noopener">Apple Design Awards</a> 페이지 — 2020~2026년 자료 기준.<br>
앱 아이콘은 페이지를 열 때 Apple iTunes API에서 실시간으로 불러옵니다(인터넷 연결 필요). 스토어에서 내려간 일부 앱·게임은 카테고리 색상의 이니셜 아이콘으로 대체됩니다. 2020년은 카테고리·앱/게임 구분 없이 8개 작품이 선정되어 '미분류'로 표기했고, 2021~2022년의 앱/게임 구분은 작품 성격에 따라 정리한 것입니다(2023년부터 Apple이 공식 구분). 다운로드 링크는 미국(US) App Store 기준이며 지역에 따라 제공 여부가 다를 수 있습니다.`,
  },
};

let lang = 'en';

function t(key, ...args){
  const val = STRINGS[lang][key];
  return typeof val === 'function' ? val(...args) : val;
}

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.getElementById('btnEn').classList.toggle('active', l === 'en');
  document.getElementById('btnKo').classList.toggle('active', l === 'ko');
  applyLang();
  buildChips();
  render();
}

function applyLang(){
  document.getElementById('mainTitle').innerHTML = t('title');
  document.getElementById('mainLede').textContent = t('lede');
  document.getElementById('stWinLabel').textContent = t('statWin');
  document.getElementById('stFinLabel').textContent = t('statFin');
  document.getElementById('stYearsLabel').textContent = t('statYears');
  document.getElementById('stCatsLabel').textContent = t('statCats');
  document.getElementById('labelYear').textContent = t('labelYear');
  document.getElementById('labelCat').textContent = t('labelCat');
  document.getElementById('labelType').textContent = t('labelType');
  document.getElementById('chipAll').textContent = t('all');
  document.getElementById('chipApp').textContent = t('app');
  document.getElementById('chipGame').textContent = t('game');
  document.getElementById('finToggleLabel').textContent = t('inclFinalists');
  document.getElementById('search').placeholder = t('searchPlaceholder');
  document.getElementById('mainFooter').innerHTML = t('footer');
}

// ─── Data ─────────────────────────────────────────────────────────────────────
const CATS = {
  delight:    {ko:"즐거움과 재미",  en:"Delight and Fun",      v:"--c-delight"},
  inclusivity:{ko:"포용성",         en:"Inclusivity",          v:"--c-inclusivity"},
  innovation: {ko:"혁신",           en:"Innovation",           v:"--c-innovation"},
  interaction:{ko:"인터랙션",       en:"Interaction",          v:"--c-interaction"},
  social:     {ko:"사회적 영향",     en:"Social Impact",        v:"--c-social"},
  visuals:    {ko:"비주얼 & 그래픽", en:"Visuals and Graphics", v:"--c-visuals"},
  spatial:    {ko:"공간 컴퓨팅",     en:"Spatial Computing",    v:"--c-spatial"},
  uncat:      {ko:"미분류",          en:"Uncategorized",        v:"--c-uncat"}
};
const CAT_ORDER = ["delight","inclusivity","innovation","interaction","social","visuals","spatial","uncat"];

function w(year,cat,type,name,dev,country,plats,url){return{year,cat,type,name,dev,country,plats,url,award:"winner"}}
function f(year,cat,type,name,dev,country,plats,url){return{year,cat,type,name,dev,country,plats,url,award:"finalist"}}

const DATA = [
// ===================== 2026 =====================
w(2026,"delight","app","grug","Ocho","Netherlands","iPhone","https://apps.apple.com/us/app/grug/id6751649802"),
f(2026,"delight","app","Blippo+","Panic, Inc.","USA","Mac","https://apps.apple.com/us/app/blippo/id6756083719?mt=12"),

// ─── Icon fetching ─────────────────────────────────────────────────────────────
const iconCache = {};
function appId(url){const m=url.match(/id(\d+)/);return m?m[1]:null;}
function storeCountry(url){const m=url.match(/apps\.apple\.com\/([a-z]{2})\//);return m?m[1]:"us";}

let jsonpId=0;
function jsonp(url){
  return new Promise(resolve=>{
    const name="__ic"+(jsonpId++);
    const s=document.createElement("script");
    let done=false;
    window[name]=function(data){done=true;try{resolve(data)}finally{delete window[name];s.remove();}};
    s.onerror=()=>{if(!done){delete window[name];s.remove();resolve(null);}};
    s.src=url+(url.includes("?")?"&":"?")+"callback="+name;
    document.head.appendChild(s);
    setTimeout(()=>{if(!done){try{delete window[name]}catch(e){}; s.remove(); resolve(null);}},8000);
  });
}
function applyResults(data){
  if(!data||!data.results)return;
  data.results.forEach(r=>{
    const id=String(r.trackId||"");
    let a=r.artworkUrl100||r.artworkUrl512||r.artworkUrl60;
    if(id && a){
      a=a.replace(/\/\d+x\d+bb\.(jpg|jpeg|png|webp)/,"/180x180bb.$1");
      iconCache[id]=a;
    }
  });
  patchIcons();
}
async function fetchIcons(){
  const byC={};
  DATA.forEach(d=>{const id=appId(d.url);if(!id)return;const cc=storeCountry(d.url);(byC[cc]=byC[cc]||new Set()).add(id);});
  const jobs=[];
  for(const cc in byC){
    const ids=[...byC[cc]];
    for(let i=0;i<ids.length;i+=18){
      const batch=ids.slice(i,i+18).join(",");
      jobs.push(jsonp("https://itunes.apple.com/lookup?country="+cc+"&id="+batch).then(applyResults));
    }
  }
  await Promise.all(jobs);
}
function patchIcons(){
  document.querySelectorAll('.icon[data-appid]').forEach(el=>{
    const id=el.dataset.appid;
    if(iconCache[id] && el.dataset.loaded!=="1"){
      el.dataset.loaded="1";
      const img=new Image();
      img.alt="";
      img.onload=()=>{el.innerHTML="";el.appendChild(img);};
      img.src=iconCache[id];
    }
  });
}

// ─── State & chips ────────────────────────────────────────────────────────────
const state={year:"all",cat:"all",type:"all",q:"",showFinalists:false};
const YEARS=[...new Set(DATA.map(d=>d.year))].sort((a,b)=>b-a);

function buildChips(){
  const yearChips=document.getElementById("yearChips");
  yearChips.innerHTML="";
  yearChips.appendChild(makeChip(t('all'),"all",()=>{state.year="all";render();},"year"));
  YEARS.forEach(y=>yearChips.appendChild(makeChip(String(y),String(y),()=>{state.year=String(y);render();},"year")));

  const catChips=document.getElementById("catChips");
  catChips.innerHTML="";
  catChips.appendChild(makeChip(t('all'),"all",()=>{state.cat="all";render();},"cat"));
  CAT_ORDER.forEach(k=>{
    const c=CATS[k];
    const chip=makeChip(c[lang],k,()=>{state.cat=k;render();},"cat");
    const dot=document.createElement("span");dot.className="dot";dot.style.background=`var(${c.v})`;
    chip.prepend(dot);chip.dataset.color=c.v;
    catChips.appendChild(chip);
  });
}

function makeChip(label,val,onclick,kind){
  const b=document.createElement("button");
  b.className="chip "+kind;b.textContent=label;b.dataset.val=val;b.dataset.kind=kind;
  b.addEventListener("click",onclick);return b;
}

document.querySelectorAll(".chip.type").forEach(b=>b.addEventListener("click",()=>{state.type=b.dataset.type;render();}));
const finToggle=document.getElementById("finToggle");
finToggle.addEventListener("click",()=>{state.showFinalists=!state.showFinalists;finToggle.classList.toggle("on",state.showFinalists);render();});
document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase();render();});

document.getElementById("stWin").textContent=DATA.filter(d=>d.award==="winner").length;
document.getElementById("stFin").textContent=DATA.filter(d=>d.award==="finalist").length;

// ─── Render ───────────────────────────────────────────────────────────────────
function setActive(){
  document.querySelectorAll(".chip.year").forEach(b=>b.classList.toggle("active",b.dataset.val===state.year));
  document.querySelectorAll(".chip.cat").forEach(b=>{
    const on=b.dataset.val===state.cat;
    b.classList.toggle("active",on);
    if(on&&b.dataset.color){b.style.background=`var(${b.dataset.color})`;b.style.borderColor=`var(${b.dataset.color})`;}
    else{b.style.background="";b.style.borderColor="";}
  });
  document.querySelectorAll(".chip.type").forEach(b=>b.classList.toggle("active",b.dataset.type===state.type));
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function monogram(name){const m=name.match(/[A-Za-z0-9]/);return escapeHtml(m?m[0].toUpperCase():"·");}

function cardHTML(d){
  const c=CATS[d.cat];
  const id=appId(d.url);
  const country=d.country?`<span class="country"> · ${escapeHtml(d.country)}</span>`:"";
  const typeLbl=d.type==="app"?t('typeApp'):t('typeGame');
  const awardLbl=d.award==="winner"?t('awardWinner'):t('awardFinalist');
  const ico=d.award==="winner"?"★":"○";
  const iconInner=(id&&iconCache[id])
    ? `<img src="${iconCache[id]}" alt="">`
    : `<span class="mono">${monogram(d.name)}</span>`;
  const dataAttr=id?` data-appid="${id}"${iconCache[id]?' data-loaded="1"':''}`:"";
  return `<article class="card" style="--ac:var(${c.v})">
    <div class="card-head">
      <div class="icon"${dataAttr}>${iconInner}</div>
      <div class="head-text">
        <h3><a href="${d.url}" target="_blank" rel="noopener">${escapeHtml(d.name)}</a></h3>
        <div class="dev">${escapeHtml(d.dev)}${country}</div>
      </div>
    </div>
    <div class="badges">
      <span class="badge cat">${escapeHtml(c[lang])}</span>
      <span class="badge type">${typeLbl}</span>
      <span class="badge award ${d.award}">${ico} ${awardLbl}</span>
    </div>
    <div class="plats">${escapeHtml(d.plats)}</div>
    <a class="dl" href="${d.url}" target="_blank" rel="noopener">${t('dlBtn')}
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17 17 7M9 7h8v8"/></svg>
    </a>
  </article>`;
}

function render(){
  setActive();
  let rows=DATA.filter(d=>{
    if(!state.showFinalists&&d.award!=="winner")return false;
    if(state.year!=="all"&&String(d.year)!==state.year)return false;
    if(state.cat!=="all"&&d.cat!==state.cat)return false;
    if(state.type!=="all"&&d.type!==state.type)return false;
    if(state.q){const hay=(d.name+" "+d.dev+" "+(d.country||"")).toLowerCase();if(!hay.includes(state.q))return false;}
    return true;
  });
  const results=document.getElementById("results");
  const meta=document.getElementById("metaLine");
  const winN=rows.filter(r=>r.award==="winner").length;
  const finN=rows.filter(r=>r.award==="finalist").length;
  meta.innerHTML=state.showFinalists
    ? t('metaWithFin', rows.length, winN, finN)
    : t('metaWinOnly', winN);
  if(rows.length===0){
    results.innerHTML=`<div class="empty"><div class="big">${t('noResults')}</div><div class="sub">${t('noResultsSub')}</div></div>`;return;
  }
  const yrs=[...new Set(rows.map(r=>r.year))].sort((a,b)=>b-a);
  results.innerHTML=yrs.map(yr=>{
    const items=rows.filter(r=>r.year===yr);
    items.sort((a,b)=>{
      const ci=CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat);
      if(ci!==0)return ci;
      if(a.award!==b.award)return a.award==="winner"?-1:1;
      return a.type.localeCompare(b.type);
    });
    const catCount=new Set(items.map(i=>i.cat)).size;
    const note=yr===2020?t('yearNote2020'):t('yearNote', catCount, items.length);
    return `<section class="yeargroup">
      <div class="yearhead"><span class="yr">${yr}</span><span class="yc">${note}</span></div>
      <div class="grid">${items.map(cardHTML).join("")}</div>
    </section>`;
  }).join("");
  patchIcons();
}

// ─── Init ─────────────────────────────────────────────────────────────────────
applyLang();
buildChips();
render();
fetchIcons();
</script>
