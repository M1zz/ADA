"Primary: News in Depth": ["Won for Social Impact on Vision Pro, this app presents news in a calm, in-depth, spatial format, with the observation point being how it uses the headset to give stories room to breathe and context rather than rapid scrolling. It aims to foster more thoughtful, less reactive news consumption.", "Vision Pro용 사회적 영향(Social Impact) 부문 수상작으로, 뉴스를 차분하고 심층적인 공간 형식으로 제시한다. 주목할 점은 빠른 스크롤 대신 헤드셋을 활용해 기사에 여백과 맥락을 부여하는 방식이다. 더 사려 깊고 덜 반사적인 뉴스 소비를 지향한다."],
"Prince of Persia: The Lost Crown": ["Awarded for Delight and Fun, this Ubisoft Metroidvania revives the franchise with fluid acrobatic combat and exploration, and the observation point is its responsive, satisfying platforming and time-bending abilities that feel great under touch and controller alike on iPhone, iPad, and Mac. Polished movement and pacing make every traversal a pleasure.", "재미와 즐거움(Delight and Fun) 부문 수상작으로, Ubisoft의 메트로배니아가 유려한 곡예 전투와 탐험으로 시리즈를 되살린다. 주목할 점은 iPhone·iPad·Mac에서 터치와 컨트롤러 모두 쾌적하게 느껴지는 반응성 좋은 플랫포밍과 시간 조작 능력이다. 잘 다듬어진 움직임과 리듬이 모든 이동을 즐겁게 만든다."],
"Procreate": ["A digital illustration powerhouse on iPad recognized for Innovation and Inclusivity: it harnesses Apple Pencil pressure, tilt, and Metal-accelerated brushes to make pro-grade painting fluid, while VoiceOver support and an approachable interface open serious art-making to a wide range of creators. Observe the responsive Pencil-driven brush engine and the surprisingly low barrier to entry for newcomers.", "iPad에서 디지털 일러스트레이션의 대표주자로, 혁신성과 포용성으로 인정받았습니다. Apple Pencil의 필압·기울기와 Metal 가속 브러시로 전문가급 페인팅을 매끄럽게 구현하면서도 VoiceOver 지원과 직관적 인터페이스로 폭넓은 창작자에게 문을 엽니다. Pencil에 반응하는 브러시 엔진과 입문자도 쉽게 시작할 수 있는 낮은 진입 장벽을 보세요."],
"Procreate Dreams": ["Savage Interactive's animation app earns Innovation and Interaction for reinventing 2D animation on iPad around touch and Apple Pencil: its real-time performance timeline lets you animate by directly manipulating objects with your fingers rather than keyframing in spreadsheets. Watch how gestures scrub, record, and shape motion in a single continuous flow.", "Savage Interactive의 애니메이션 앱으로, iPad에서 터치와 Apple Pencil을 중심으로 2D 애니메이션을 재창조해 혁신성과 인터랙션을 수상했습니다. 실시간 퍼포먼스 타임라인을 통해 키프레임을 일일이 찍는 대신 손가락으로 오브젝트를 직접 움직여 애니메이션을 만들 수 있습니다. 제스처로 스크럽하고 녹화하며 움직임을 빚어내는 끊김 없는 흐름을 관찰하세요."],
"Railbound": ["This track-laying puzzle game wins Interaction for turning a simple core mechanic into deeply satisfying touch play: you draw and reroute rail tiles so coupled train cars arrive in the right order. Observe how clean tap-and-place controls keep focus entirely on the puzzle logic.", "선로를 놓는 퍼즐 게임으로, 단순한 핵심 메커니즘을 깊은 만족감을 주는 터치 플레이로 바꿔 인터랙션을 수상했습니다. 연결된 기차 칸이 올바른 순서로 도착하도록 선로 타일을 그리고 다시 배치합니다. 퍼즐 논리에만 집중하게 만드는 깔끔한 탭 앤 플레이스 조작을 보세요."],
"RakugakiAR": ["Whatever Inc.'s AR toy wins Delight and Fun by bringing your hand-drawn doodles to life: scribble a creature on paper, scan it, and watch it wobble, walk, and react in augmented reality. The joy is in the observation point itself, seeing a child's drawing suddenly animate and roam your room.", "Whatever Inc.의 AR 장난감으로, 손으로 그린 낙서에 생명을 불어넣어 즐거움과 재미를 수상했습니다. 종이에 생물을 끄적이고 스캔하면 증강현실 속에서 뒤뚱거리고 걸어 다니며 반응합니다. 아이의 그림이 갑자기 살아 움직여 방 안을 돌아다니는 그 장면 자체가 관찰 포인트입니다."],
"Rebel Girls": ["Built on the bestselling book series, Rebel Girls wins Social Impact for empowering young readers with hundreds of illustrated stories of real women who changed the world. Observe how its narrated, role-model-driven library is designed to build confidence and broaden girls' sense of what's possible.", "베스트셀러 도서 시리즈를 바탕으로 한 Rebel Girls는 세상을 바꾼 실존 여성들의 일러스트 이야기 수백 편으로 어린 독자에게 힘을 실어 사회적 영향을 수상했습니다. 내레이션이 담긴 롤모델 중심 라이브러리가 자신감을 키우고 소녀들이 그리는 가능성의 폭을 넓히도록 설계된 점을 보세요."],
"Resident Evil Village": ["Capcom's horror flagship wins Visuals and Graphics and Innovation for delivering console-class RE Engine fidelity natively on Mac with Apple silicon: ray tracing, MetalFX upscaling, and atmospheric lighting bring its gothic village to life. Observe the volumetric fog, detailed material shading, and smooth performance that prove desktop-grade AAA gaming on the platform.", "Capcom의 호러 대표작으로, Apple Silicon Mac에서 콘솔급 RE 엔진 충실도를 네이티브로 구현해 비주얼과 그래픽, 혁신성을 수상했습니다. 레이 트레이싱, MetalFX 업스케일링, 분위기 있는 조명이 고딕풍 마을을 생생하게 살려냅니다. 볼류메트릭 안개, 정교한 재질 셰이딩, 그리고 데스크톱급 AAA 게이밍을 증명하는 부드러운 성능을 관찰하세요."],
"Rise: Energy & Sleep Tracker": ["Rise wins Innovation for applying sleep science to a personal energy model: instead of just logging sleep, it predicts your daily energy peaks and dips from your sleep debt and circadian rhythm. Observe the energy schedule that translates complex chronobiology into a simple, actionable daily timeline.", "Rise는 수면 과학을 개인 에너지 모델에 적용해 혁신성을 수상했습니다. 단순히 수면을 기록하는 데 그치지 않고 수면 부채와 생체 리듬으로부터 하루의 에너지 정점과 저점을 예측합니다. 복잡한 시간생물학을 간단하고 실행 가능한 하루 타임라인으로 풀어낸 에너지 스케줄을 보세요."],
"Riveo": ["Forge and Form's app wins Visuals and Graphics for its meticulous, tactile art direction and fluid animation on iPhone. Observe the polished motion design and crafted visual details that make every screen feel hand-considered.", "Forge and Form의 앱으로, iPhone에서 섬세하고 촉각적인 아트 디렉션과 유려한 애니메이션으로 비주얼과 그래픽을 수상했습니다. 모든 화면이 손수 다듬어진 듯 느껴지게 하는 정교한 모션 디자인과 공들인 시각적 디테일을 관찰하세요."],
"Rooms": ["From Things, Inc., Rooms wins Delight and Fun and Visuals and Graphics for its charming voxel dioramas you can build, customize, and animate. Observe the playful, hand-crafted blocky world and the cozy joy of decorating and tinkering with interactive little scenes.", "Things, Inc.가 만든 Rooms는 직접 짓고 꾸미고 움직일 수 있는 사랑스러운 복셀 디오라마로 즐거움과 재미, 비주얼과 그래픽을 수상했습니다. 장난기 가득한 수공예풍 블록 세계와, 인터랙티브한 작은 장면을 꾸미고 만지작거리는 아늑한 즐거움을 보세요."],
"Rytmos": ["Floppy Club's puzzle game wins Interaction for fusing line-drawing puzzles with music: each solved path plays back as a looping melody, layering instruments inspired by world musical traditions. Observe how every interaction you make literally composes the soundtrack as you play.", "Floppy Club의 퍼즐 게임으로, 선 그리기 퍼즐과 음악을 결합해 인터랙션을 수상했습니다. 풀어낸 각 경로가 반복되는 멜로디로 재생되며 세계 음악 전통에서 영감을 받은 악기들이 겹겹이 쌓입니다. 플레이하며 만들어내는 모든 조작이 말 그대로 사운드트랙을 작곡하는 과정을 관찰하세요."],
"SILT": ["Spiral Circus's eerie monochrome adventure wins Visuals and Graphics for its stark, hand-drawn underwater world rendered entirely in haunting black and white. Observe the striking silhouette art direction and unsettling deep-sea atmosphere that define its singular visual identity.", "Spiral Circus의 음산한 흑백 어드벤처로, 잊히지 않는 흑백으로만 그려낸 황량한 손그림 수중 세계로 비주얼과 그래픽을 수상했습니다. 독보적인 시각 정체성을 이루는 강렬한 실루엣 아트 디렉션과 불안한 심해 분위기를 관찰하세요."],
"Sago Mini First Words": ["Sago Mini's early-learning app wins Social Impact for gently introducing toddlers to first words through safe, friendly, ad-free play. Observe its toddler-proof interface and warm characters designed to support pre-readers' language development without pressure or distraction.", "Sago Mini의 유아 학습 앱으로, 안전하고 친근하며 광고 없는 놀이를 통해 유아에게 첫 단어를 부드럽게 소개해 사회적 영향을 수상했습니다. 압박이나 산만함 없이 글을 읽기 전 아이의 언어 발달을 돕도록 설계된, 유아도 다루기 쉬운 인터페이스와 따뜻한 캐릭터를 보세요."],
"Sago Mini Jinja's Garden": ["This kids' game wins Inclusivity and Interaction for its gentle, frustration-free design that meets very young players where they are across iPhone, iPad, Mac, and TV. Observe the forgiving touch interactions and openly explorable garden that welcome children of all abilities without fail states.", "이 어린이 게임은 iPhone, iPad, Mac, TV 전반에서 아주 어린 플레이어의 눈높이에 맞춘 부드럽고 좌절 없는 디자인으로 포용성과 인터랙션을 수상했습니다. 실패 상태 없이 모든 능력의 아이를 환영하는 너그러운 터치 인터랙션과 자유롭게 탐험 가능한 정원을 관찰하세요."],
"Sayonara Wild Hearts": ["Simogo's neon pop-album rhythm game (2020, pre-category era) is celebrated for its seamless fusion of music, motion, and arcade action set to an original synth-pop soundtrack. Observe how each level flows like a music video, with rhythm-locked motorcycle chases and dreamlike transitions blending into one continuous performance.", "Simogo의 네온빛 팝 앨범 리듬 게임(2020, 카테고리 도입 이전)으로, 오리지널 신스팝 사운드트랙에 맞춘 음악·움직임·아케이드 액션의 매끄러운 융합으로 찬사를 받았습니다. 각 레벨이 뮤직비디오처럼 흐르며 리듬에 맞춘 오토바이 추격과 몽환적 전환이 하나의 연속된 공연으로 어우러지는 모습을 보세요."],
"Shapr 3D": ["Shapr3D (2020, pre-category era) is recognized for bringing professional CAD modeling to iPad with Apple Pencil-driven direct manipulation. Observe how precise parametric solid modeling becomes intuitive sketch-and-pull gestures, putting industrial design within reach of touch.", "Shapr3D(2020, 카테고리 도입 이전)는 Apple Pencil 기반 직접 조작으로 전문가용 CAD 모델링을 iPad에 가져와 인정받았습니다. 정밀한 파라메트릭 솔리드 모델링이 직관적인 스케치 앤 풀 제스처로 바뀌어 산업 디자인을 터치로 손에 넣게 되는 과정을 관찰하세요."],
"Shuffles by Pinterest": ["Pinterest's collage app wins Interaction for its delightful cutout-and-arrange creativity: tap any object in an image and it auto-extracts so you can layer, animate, and remix collages. Observe the instant subject cutout and the tactile drag-to-compose flow that make mood-boarding feel like play.", "Pinterest의 콜라주 앱으로, 즐거운 오려내기·배치 창작으로 인터랙션을 수상했습니다. 이미지 속 사물을 탭하면 자동으로 추출되어 레이어를 쌓고 움직이고 콜라주를 리믹스할 수 있습니다. 즉각적인 피사체 오려내기와, 무드보드 작업을 놀이처럼 만드는 촉각적인 드래그 구성 흐름을 보세요."],
"Sid Meier's Civilization VII": ["Firaxis's strategy epic wins Inclusivity for making a notoriously deep 4X game approachable across iPhone, iPad, and Mac through scalable difficulty, clear tutorials, and adaptive interfaces. Observe how the onboarding and accessibility options let newcomers and veterans alike command an empire on any device.", "Firaxis의 전략 대작으로, 악명 높을 만큼 깊이 있는 4X 게임을 확장 가능한 난이도, 명확한 튜토리얼, 적응형 인터페이스를 통해 iPhone, iPad, Mac에서 누구나 접근할 수 있게 만들어 포용성을 수상했습니다. 초보자와 베테랑 모두 어떤 기기에서든 제국을 통치할 수 있게 해주는 온보딩과 접근성 옵션을 관찰하세요."],
"Skate City: New York": ["Snowman's skateboarding game wins Interaction for translating the feel of real tricks into swipe-and-flick touch controls. Observe how gesture-based ollies, grinds, and flips chain together fluidly, capturing skating's rhythm and timing on a touchscreen.", "Snowman의 스케이트보드 게임으로, 실제 트릭의 감각을 스와이프와 플릭 터치 조작으로 옮겨 인터랙션을 수상했습니다. 제스처 기반의 올리, 그라인드, 플립이 유연하게 이어지며 스케이팅의 리듬과 타이밍을 터치스크린에 담아낸 점을 관찰하세요."],
"Sky Guide": ["Fifth Star Labs' astronomy app wins Spatial Computing for bringing the night sky into Vision Pro: hold up your view and constellations, planets, and satellites map onto the real space around you. Observe how the immersive star field surrounds you in 3D, turning identification into a spatial, look-up-and-around experience.", "Fifth Star Labs의 천문 앱으로, 밤하늘을 Vision Pro로 가져와 공간 컴퓨팅을 수상했습니다. 시선을 들면 별자리, 행성, 위성이 주변 실제 공간에 매핑됩니다. 몰입형 별밭이 3D로 당신을 둘러싸며 별 식별을 올려다보고 둘러보는 공간적 경험으로 바꾸는 모습을 관찰하세요."],
"Sky: Children of the Light": ["Thatgamecompany's social adventure (2020, pre-category era) is celebrated for its luminous art and emotionally generous multiplayer, where wordless cooperation and gift-giving connect strangers. Observe the soaring flight through golden, painterly landscapes and the gentle bonds formed with other travelers.", "Thatgamecompany의 소셜 어드벤처(2020, 카테고리 도입 이전)로, 빛나는 아트와 정서적으로 너그러운 멀티플레이로 찬사를 받았으며, 말 없는 협력과 선물 주고받기로 낯선 이들을 잇습니다. 황금빛 회화적 풍경 속을 날아오르는 비행과 다른 여행자들과 맺는 잔잔한 유대를 관찰하세요."],
"Slopes": ["Breakpoint Studio's ski-and-snowboard tracker wins Interaction for turning sensor data into effortless on-mountain insight across iPhone and Apple Watch. Observe how automatic run detection and glanceable Watch metrics let riders track speed, vertical, and runs without ever fiddling with the phone.", "Breakpoint Studio의 스키·스노보드 트래커로, 센서 데이터를 iPhone과 Apple Watch 전반에서 손쉬운 산 위 인사이트로 바꿔 인터랙션을 수상했습니다. 자동 활강 감지와 한눈에 보는 Watch 지표를 통해 라이더가 휴대폰을 만지작거리지 않고도 속도, 고도차, 활강 횟수를 추적할 수 있는 점을 관찰하세요."],
"SmartGym": ["Mateus Abras's fitness app wins Innovation for its deep, system-wide integration across iPhone, iPad, Watch, Mac, and Vision Pro, with smart workout automation and rich HealthKit syncing. Observe how routines drive real-time Watch guidance and seamlessly carry your training data across every Apple device.", "Mateus Abras의 피트니스 앱으로, iPhone, iPad, Watch, Mac, Vision Pro 전반의 깊은 시스템 통합과 스마트 운동 자동화, 풍부한 HealthKit 동기화로 혁신성을 수상했습니다. 루틴이 실시간 Watch 가이드를 구동하고 모든 Apple 기기로 운동 데이터를 매끄럽게 이어주는 방식을 관찰하세요."],
"Song of Bloom": ["Philipp Stollenmayer's puzzle game (2020, pre-category era) is celebrated for its inventive, ever-shifting art styles and unconventional storytelling that bends the rules of how a game looks and plays. Observe how each chapter reinvents its visual language and toys with the device itself to tell a layered, surprising tale.", "Philipp Stollenmayer의 퍼즐 게임(2020, 카테고리 도입 이전)으로, 게임의 외형과 플레이 규칙을 비트는 기발하고 끊임없이 변하는 아트 스타일과 파격적인 서사로 찬사를 받았습니다. 각 챕터가 시각 언어를 새로 만들어내고 기기 자체를 활용해 다층적이고 놀라운 이야기를 풀어가는 방식을 관찰하세요."],
"South of the Circle": ["State of Play's narrative game wins Delight and Fun for its handcrafted, emotion-driven storytelling set in 1960s Antarctica, conveyed through expressive performances and a tactile diorama art style. Observe the cinematic emotional dialogue system and the warm, model-like environments that carry its romance.", "State of Play의 내러티브 게임으로, 1960년대 남극을 배경으로 한 수공예적이고 감정 중심의 스토리텔링을 풍부한 연기와 촉각적인 디오라마 아트 스타일로 전달해 즐거움과 재미를 수상했습니다. 영화적인 감정 대화 시스템과 로맨스를 떠받치는 따뜻한 모형 같은 환경을 관찰하세요."],
"Sp!ng": ["SMG Studio's arcade game wins Interaction for its elegant one-touch slingshot mechanic: tap to fling and snap between points across hundreds of bite-sized levels. Observe how a single, perfectly tuned input becomes endlessly varied, satisfying play.", "SMG Studio의 아케이드 게임으로, 우아한 원터치 슬링샷 메커니즘으로 인터랙션을 수상했습니다. 탭 한 번으로 수백 개의 짧은 레벨에서 지점 사이를 튕기며 이동합니다. 완벽하게 조율된 단 하나의 입력이 끝없이 다채롭고 만족스러운 플레이가 되는 과정을 관찰하세요."],
"Speechify": ["Speechify wins Inclusivity for turning any text into natural spoken audio, making reading accessible for people with dyslexia, low vision, or attention differences. Observe the high-quality text-to-speech with adjustable speed and synchronized highlighting that lets anyone listen to documents, articles, and books.", "Speechify는 어떤 텍스트든 자연스러운 음성 오디오로 바꿔 난독증, 저시력, 주의력 차이를 가진 사람들이 읽기에 접근할 수 있게 해 포용성을 수상했습니다. 속도 조절과 동기화된 강조 표시를 갖춘 고품질 음성 변환으로 누구나 문서, 기사, 책을 들을 수 있게 해주는 점을 관찰하세요."],
"Spilled!": ["Lente Cuenen's cozy game wins Social Impact for its gentle environmental message: you pilot a little boat cleaning oil and trash from the sea, restoring calm waters. Observe how the soothing, low-stress cleanup loop quietly encourages care for the ocean.", "Lente Cuenen의 아늑한 게임으로, 작은 보트를 몰며 바다의 기름과 쓰레기를 치워 잔잔한 수면을 되살리는 부드러운 환경 메시지로 사회적 영향을 수상했습니다. 마음을 달래주는 저스트레스 청소 루프가 조용히 바다를 향한 돌봄을 권하는 방식을 관찰하세요."],
"StaffPad": ["StaffPad (2020, pre-category era) is recognized for letting composers handwrite music notation with Apple Pencil and have it instantly recognized, edited, and played back. Observe how natural handwritten notes transform into clean, playable engraved scores in real time.", "StaffPad(2020, 카테고리 도입 이전)는 작곡가가 Apple Pencil로 악보를 손으로 적으면 즉시 인식·편집·재생되도록 해 인정받았습니다. 손으로 쓴 음표가 실시간으로 깔끔하고 연주 가능한 인쇄 악보로 변환되는 과정을 관찰하세요."],
"Structured": ["unorderly's daily planner wins Inclusivity for its clear, visual timeline approach to organizing the day, designed to be approachable across iPhone, iPad, Mac, and Watch. Observe how the simple, uncluttered timeline and broad accessibility support make planning manageable for a wide range of users.", "unorderly의 일일 플래너로, 하루를 정리하는 명확하고 시각적인 타임라인 방식으로 iPhone, iPad, Mac, Watch 전반에서 접근하기 쉽게 설계해 포용성을 수상했습니다. 단순하고 깔끔한 타임라인과 폭넓은 접근성 지원이 다양한 사용자에게 계획 세우기를 수월하게 만드는 점을 관찰하세요."],
"Sunlitt": ["Nicolas Mariniello's sun-tracking app wins Visuals and Graphics for beautifully visualizing the sun's path, golden hours, and light conditions for any location. Observe the elegant solar-arc and shadow visualizations that turn astronomical data into a clear, lovely graphic.", "Nicolas Mariniello의 태양 추적 앱으로, 어느 위치에서든 태양의 궤적, 골든아워, 빛 조건을 아름답게 시각화해 비주얼과 그래픽을 수상했습니다. 천문 데이터를 명확하고 사랑스러운 그래픽으로 바꿔내는 우아한 태양 궤적과 그림자 시각화를 관찰하세요."],
"SwingVision: A.I. Tennis App": ["SwingVision wins Innovation for using on-device AI and computer vision to analyze tennis from just an iPhone camera, tracking shots, calling lines, and breaking down your technique. Observe how it turns a phone propped courtside into an automatic coach and line judge.", "SwingVision은 온디바이스 AI와 컴퓨터 비전으로 iPhone 카메라만으로 테니스를 분석해 샷을 추적하고 라인을 판정하며 기술을 분석해 혁신성을 수상했습니다. 코트 옆에 세워둔 휴대폰을 자동 코치이자 선심으로 바꿔내는 방식을 관찰하세요."],
"Synth Riders": ["Kluge Strategic's rhythm game wins Spatial Computing for its full-body music experience on Vision Pro, where you reach, dodge, and flow to the beat in immersive space using hand tracking. Observe how note orbs and rails surround you in 3D, turning the room into a dance floor without controllers.", "Kluge Strategic의 리듬 게임으로, Vision Pro에서 핸드 트래킹으로 박자에 맞춰 뻗고 피하고 흐르는 전신 음악 경험을 제공해 공간 컴퓨팅을 수상했습니다. 노트 구체와 레일이 3D로 당신을 둘러싸 컨트롤러 없이 방을 댄스 플로어로 바꾸는 모습을 관찰하세요."],
"TR-49": ["inkle's game wins Innovation and Interaction for the studio's signature inventive systems design paired with fresh, intuitive touch controls. Observe how its mechanics and interface break from convention to create an interaction model that feels distinctly its own.", "inkle의 게임으로, 이 스튜디오 특유의 기발한 시스템 설계와 신선하고 직관적인 터치 조작을 결합해 혁신성과 인터랙션을 수상했습니다. 그 메커니즘과 인터페이스가 관습을 벗어나 독자적인 인터랙션 모델을 만들어내는 방식을 관찰하세요."],
"Taobao": ["Taobao wins Interaction for reimagining shopping on Vision Pro with spatial browsing, where products appear and can be examined in your physical space. Observe how eye and hand input let you scan, inspect, and interact with merchandise in 3D rather than scrolling a flat grid.", "Taobao는 공간 브라우징으로 Vision Pro에서의 쇼핑을 재해석해 인터랙션을 수상했으며, 제품이 실제 공간에 나타나 살펴볼 수 있습니다. 시선과 손 입력으로 평면 그리드를 스크롤하는 대신 상품을 3D로 훑어보고 살펴보며 상호작용하는 방식을 관찰하세요."],
"Thank Goodness You're Here!": ["Panic's comedy game wins Delight and Fun for its riotous British slapstick humor, hand-drawn cartoon world, and slap-everything interactivity. Observe how every absurd character and gag rewards your curiosity, making the whole town a playground of comic surprises.", "Panic의 코미디 게임으로, 떠들썩한 영국식 슬랩스틱 유머, 손그림 만화 세계, 무엇이든 찰싹 때리는 인터랙션으로 즐거움과 재미를 수상했습니다. 엉뚱한 캐릭터와 개그 하나하나가 호기심에 보답하며 마을 전체를 코믹한 놀라움의 놀이터로 만드는 방식을 관찰하세요."],
"The Bear": ["A narrative game tackling depression and emotional resilience, earning Social Impact for using interactive storytelling to make a hard mental-health subject approachable. Observe how the bear metaphor and gentle pacing turn an inner struggle into something players can understand and sit with.", "우울과 정서적 회복을 다루는 내러티브 게임으로, 다루기 어려운 정신건강 주제를 인터랙티브 스토리텔링으로 친근하게 풀어내 Social Impact를 받았습니다. 곰이라는 은유와 잔잔한 호흡이 내면의 고통을 플레이어가 이해하고 머무를 수 있는 경험으로 바꾸는 점을 관찰하세요."],
"The Outsiders: Athlete Tracker": ["An athlete-training companion recognized for Interaction through a tightly paired iPhone and Apple Watch experience where logging and reviewing workouts feels fluid and glanceable. Watch how data entry and feedback flow naturally between wrist and phone during a session.", "운동 기록과 리뷰가 매끄럽고 한눈에 들어오도록 iPhone과 Apple Watch를 긴밀히 연결한 점으로 Interaction을 받은 선수 훈련 동반 앱입니다. 운동 중 손목과 폰 사이를 자연스럽게 오가는 데이터 입력과 피드백 흐름을 살펴보세요."],
"The Wreck": ["An interactive drama about a woman confronting family trauma and a life crisis, earning Social Impact by giving weight to grief, regret, and difficult human relationships. Notice how the narrative structure lets you rewind and reframe painful memories to find understanding.", "가족의 상처와 인생의 위기를 마주한 여성의 이야기를 그린 인터랙티브 드라마로, 슬픔과 후회, 어려운 인간관계에 무게를 실어 Social Impact를 받았습니다. 고통스러운 기억을 되감고 다시 바라보며 이해에 다다르게 하는 서사 구조를 눈여겨보세요."],
"Tide Guide: Charts & Tables": ["A tide-prediction app honored for both Interaction and Visuals and Graphics, turning dense oceanographic data into clear, beautiful charts you can scrub through with a touch. Look at how the animated tide curves and clean typography make timing and height instantly readable across every Apple platform.", "방대한 해양 데이터를 손끝으로 훑어볼 수 있는 명료하고 아름다운 차트로 바꿔 Interaction과 Visuals and Graphics를 함께 받은 조석 예측 앱입니다. 애니메이션 조석 곡선과 정갈한 타이포그래피가 모든 애플 플랫폼에서 시간과 조위를 즉시 읽히게 하는 점을 보세요."],
"Tiimo": ["A visual daily-planner built for neurodivergent users, earning Inclusivity by structuring time with pictograms, gentle timers, and clear routines that support ADHD and autistic minds. Observe how the visual schedule reduces cognitive load instead of overwhelming users with text-heavy lists.", "신경다양성 사용자를 위한 시각적 일정 관리 앱으로, 픽토그램과 부드러운 타이머, 명료한 루틴으로 시간을 구조화해 ADHD와 자폐 사용자를 지원하며 Inclusivity를 받았습니다. 텍스트 위주 목록 대신 시각적 일정이 인지 부담을 줄여주는 방식을 관찰하세요."],
"Townscaper": ["A toy-like town builder honored for Innovation, where a clever procedural grid turns single taps into instantly coherent, irregular medieval architecture. Watch how placing one block auto-resolves walls, roofs, and stairs through generative geometry rather than manual modeling.", "탭 한 번이 즉시 그럴듯한 불규칙 중세 건축으로 완성되는 영리한 절차적 그리드로 Innovation을 받은 장난감 같은 마을 제작 게임입니다. 블록 하나를 놓으면 생성형 지오메트리가 벽과 지붕, 계단을 자동으로 정리해 주는 과정을 지켜보세요."],
"Train Fitness": ["A workout tracker earning Inclusivity by using on-device motion sensing to detect and count exercises automatically, lowering barriers for users who struggle with manual logging. Notice how automatic rep and set detection makes strength training accessible without constant screen interaction.", "동작 센서로 운동을 자동 감지하고 횟수를 세어, 수동 기록이 어려운 사용자의 장벽을 낮춰 Inclusivity를 받은 운동 추적 앱입니다. 자동 반복·세트 감지가 화면을 계속 만지지 않고도 근력 운동을 접근 가능하게 만드는 점을 살펴보세요."],
"Transit": ["A public-transit app honored for Interaction, where real-time arrivals, GO mode step-by-step guidance, and crowd-sourced data make navigating a city feel effortless. Look at how the one-glance home screen surfaces your most likely trips and live departure countdowns.", "실시간 도착 정보, 단계별 안내인 GO 모드, 사용자 참여 데이터로 도시 이동을 수월하게 만들어 Interaction을 받은 대중교통 앱입니다. 한눈에 보이는 홈 화면이 가장 탈 만한 노선과 실시간 출발 카운트다운을 띄워주는 방식을 보세요."],
"Universe": ["A stargazing app earning Innovation by blending real-time astronomical data with augmented reality so users can point their device at the sky and identify celestial objects. Observe how device orientation and AR overlays turn the night sky into an interactive map.", "실시간 천문 데이터와 증강현실을 결합해 기기를 하늘로 향하면 천체를 식별할 수 있게 한 점으로 Innovation을 받은 별 관측 앱입니다. 기기 방향과 AR 오버레이가 밤하늘을 인터랙티브 지도로 바꾸는 방식을 관찰하세요."],
"Universe — Website Builder": ["A mobile-first website builder honored for Inclusivity, letting anyone design and publish a real site entirely from an iPhone with a grid-based, drag-and-drop canvas. Notice how the block grid removes coding and desktop requirements, opening web creation to non-technical makers.", "그리드 기반 드래그앤드롭 캔버스로 누구나 iPhone만으로 진짜 웹사이트를 만들고 게시하게 해 Inclusivity를 받은 모바일 우선 웹사이트 빌더입니다. 블록 그리드가 코딩과 데스크톱 요건을 없애 비전문가에게 웹 제작을 열어주는 점을 눈여겨보세요."],
"Unpacking": ["A zen puzzle game about unpacking boxes across life's moves, earning Inclusivity through quiet, no-fail play and rich accessibility options that welcome players of all abilities. Watch how a wordless story unfolds purely through the objects you place, requiring no reading or reflexes.", "이사할 때마다 상자를 푸는 잔잔한 퍼즐 게임으로, 실패 없는 차분한 플레이와 풍부한 접근성 옵션으로 모든 사용자를 포용해 Inclusivity를 받았습니다. 글이나 순발력 없이 배치하는 물건만으로 펼쳐지는 무언의 이야기를 지켜보세요."],
"Vectornator: Vector Design": ["A free vector-design tool honored for Interaction, bringing precise pen, shape, and Apple Pencil editing to iPad with a fluid, gesture-rich canvas. Look at how multi-touch and pencil input combine for professional illustration without a desktop workflow.", "정밀한 펜·도형·Apple Pencil 편집을 제스처가 풍부한 캔버스로 iPad에 구현해 Interaction을 받은 무료 벡터 디자인 도구입니다. 멀티터치와 펜슬 입력이 결합해 데스크톱 없이도 전문 일러스트 작업을 가능하게 하는 점을 보세요."],
"Vocabulary – Learn words daily": ["A daily word-learning app earning Visuals and Graphics through elegant typography, refined color, and crisp card layouts that make each new word feel like a designed artifact. Notice how restrained art direction and motion turn vocabulary study into a visually pleasing daily ritual.", "우아한 타이포그래피와 절제된 색, 깔끔한 카드 레이아웃으로 새 단어 하나하나를 디자인된 작품처럼 느끼게 해 Visuals and Graphics를 받은 단어 학습 앱입니다. 정제된 아트 디렉션과 모션이 단어 공부를 시각적으로 즐거운 일상 의식으로 바꾸는 점을 살펴보세요."],
"Voice Dream Reader": ["A text-to-speech reading app earning Inclusivity by making written content accessible to people with dyslexia, low vision, and other reading differences through high-quality voices and synchronized highlighting. Observe how adjustable speech, fonts, and visual tracking let everyone consume text their own way.", "고품질 음성과 동기화된 하이라이트로 난독증, 저시력 등 읽기에 어려움을 겪는 사람에게 글을 접근 가능하게 해 Inclusivity를 받은 텍스트 음성 변환 앱입니다. 조절 가능한 음성·글꼴·시각 추적이 누구나 자기 방식으로 글을 읽게 해주는 점을 관찰하세요."],
"WHAT THE CAR?": ["An absurdist driving game honored for Delight and Fun, where your car constantly transforms into legs, gliders, and sillier things, delivering nonstop surprise and comedy. Watch how each short level reinvents the rules to keep laughter and joy front and center.", "차가 다리, 글라이더, 더 엉뚱한 것으로 끊임없이 변하며 쉴 새 없는 놀라움과 코미디를 선사해 Delight and Fun을 받은 기발한 운전 게임입니다. 짧은 레벨마다 규칙을 새로 비틀어 웃음과 즐거움을 전면에 두는 방식을 지켜보세요."],
"Watch Duty: Wildfire Maps": ["A wildfire-alert app earning Social Impact by giving communities real-time fire perimeters, evacuation info, and alerts from a volunteer network during life-threatening emergencies. Notice how clear maps and timely push alerts can directly help people decide when to flee.", "자원봉사 네트워크를 통한 실시간 화재 경계, 대피 정보, 경보를 제공해 생명을 위협하는 비상 상황에서 지역사회를 도와 Social Impact를 받은 산불 경보 앱입니다. 명료한 지도와 적시 푸시 경보가 사람들의 대피 판단을 직접 돕는 점을 눈여겨보세요."],
"Waterllama": ["A hydration tracker honored for Delight and Fun, where a charming llama mascot, playful animations, and satisfying liquid effects make logging water feel joyful. Look at how characterful illustration and micro-interactions turn a mundane habit into a delightful daily check-in.", "사랑스러운 라마 마스코트와 장난기 있는 애니메이션, 만족스러운 액체 효과로 물 마시기 기록을 즐겁게 만들어 Delight and Fun을 받은 수분 추적 앱입니다. 개성 있는 일러스트와 마이크로 인터랙션이 평범한 습관을 즐거운 일상 체크인으로 바꾸는 점을 보세요."],
"Wavelength": ["A spatial audio and listening app earning Innovation by exploring new ways to experience sound on Vision Pro and across devices. Observe how it pushes novel audio interaction and presentation beyond a conventional player interface.", "Vision Pro와 여러 기기에서 소리를 경험하는 새로운 방식을 탐구해 Innovation을 받은 공간 오디오·청취 앱입니다. 일반적인 플레이어 인터페이스를 넘어 새로운 오디오 인터랙션과 표현을 밀어붙이는 점을 관찰하세요."],
"What Remains of Edith Finch": ["A first-person narrative game honored for Interaction, where each family member's story is told through a uniquely tailored control scheme tuned beautifully for touch. Watch how the gameplay verbs shift dramatically per vignette, making interaction itself the storytelling device.", "각 가족 구성원의 이야기를 저마다 다른, 터치에 맞춰 정교하게 다듬은 조작 방식으로 전달해 Interaction을 받은 1인칭 내러티브 게임입니다. 장면마다 조작 행위 자체가 극적으로 바뀌며 인터랙션이 곧 스토리텔링 장치가 되는 점을 지켜보세요."],
"Where Cards Fall": ["A poignant puzzle game from the pre-category ADA era, recognized for fusing elegant house-of-cards construction puzzles with a tender coming-of-age story. Observe how building card structures to clear a path mirrors the emotional milestones of growing up.", "카테고리 도입 이전 시기에 수상한 가슴 뭉클한 퍼즐 게임으로, 우아한 카드집 건축 퍼즐과 다정한 성장 이야기를 결합한 점으로 인정받았습니다. 길을 내기 위해 카드 구조물을 쌓는 행위가 성장의 정서적 이정표와 맞물리는 점을 관찰하세요."],
"Wonderbox": ["A build-and-play adventure honored for Delight and Fun and Interaction, letting players create and share their own levels with intuitive, joyful touch tools. Look at how easy creation and charming exploration combine so making a world feels as fun as playing one.", "직관적이고 즐거운 터치 도구로 자기만의 레벨을 만들고 공유하게 해 Delight and Fun과 Interaction을 함께 받은 제작·플레이 어드벤처입니다. 손쉬운 제작과 매력적인 탐험이 어우러져 세계를 만드는 일이 노는 것만큼 즐겁게 느껴지는 점을 보세요."],
"Wylde Flowers": ["A cozy farming-and-witchcraft sim earning Inclusivity and Social Impact through full voice acting, warm LGBTQ+ representation, and an inclusive community story. Notice how the welcoming cast and accessible cozy gameplay model belonging for players who rarely see themselves.", "전체 음성 연기와 따뜻한 LGBTQ+ 표현, 포용적인 공동체 이야기로 Inclusivity와 Social Impact를 함께 받은 아늑한 농사·마법 시뮬레이션입니다. 환대하는 등장인물과 접근성 높은 아늑한 플레이가 좀처럼 자신을 보지 못하던 이들에게 소속감을 그려주는 점을 살펴보세요."],
"despelote": ["An autobiographical game about childhood and soccer in Quito, earning Social Impact by capturing a specific cultural and personal memory of Ecuador with documentary tenderness. Observe how everyday street scenes and ambient sound evoke a real time and place rather than a generic setting.", "키토에서 보낸 어린 시절과 축구에 관한 자전적 게임으로, 에콰도르의 특정한 문화적·개인적 기억을 다큐멘터리적 다정함으로 담아 Social Impact를 받았습니다. 평범한 거리 풍경과 주변 소리가 일반적 배경이 아닌 실제 시간과 장소를 불러일으키는 점을 관찰하세요."],
"djay": ["A DJ app honored for Spatial Computing, reimagining turntables and mixers as floating, hands-on instruments you manipulate in space on Vision Pro. Watch how virtual decks anchored in your room respond to direct gestures, making mixing feel physical without hardware.", "턴테이블과 믹서를 Vision Pro 공간에 떠 있는 손으로 다루는 악기로 재해석해 Spatial Computing을 받은 DJ 앱입니다. 방 안에 고정된 가상 덱이 직접 제스처에 반응해 하드웨어 없이도 믹싱이 물리적으로 느껴지는 점을 지켜보세요."],
"finity.": ["A minimalist card-and-tile puzzle game earning Interaction through clean, satisfying touch mechanics where every drag and placement feels precise and responsive. Look at how the spare ruleset and tactile feedback make each move read instantly.", "모든 드래그와 배치가 정밀하고 반응성 있게 느껴지는 깔끔하고 만족스러운 터치 메커니즘으로 Interaction을 받은 미니멀 카드·타일 퍼즐 게임입니다. 간결한 규칙과 촉각적 피드백이 매 수를 즉시 읽히게 하는 점을 보세요."],
"grug": ["A playful app honored for Delight and Fun, leaning into charm, humor, and characterful animation to make everyday interaction feel joyful. Notice how the whimsical visual personality and tactile responses turn routine use into something that makes you smile.", "매력과 유머, 개성 있는 애니메이션을 앞세워 일상적인 사용을 즐겁게 만들어 Delight and Fun을 받은 장난기 가득한 앱입니다. 엉뚱한 비주얼 개성과 촉각적 반응이 평범한 사용을 미소 짓게 하는 경험으로 바꾸는 점을 살펴보세요."],
"iA Writer": ["A focused writing app earning Interaction through distraction-free typography, focus mode, and a keyboard- and gesture-tuned editor that keeps you in the flow of writing. Observe how syntax highlighting and the clean monospaced canvas make composition feel frictionless.", "방해 없는 타이포그래피, 포커스 모드, 키보드·제스처에 맞춰 다듬은 에디터로 글쓰기 몰입을 지켜내 Interaction을 받은 집중형 글쓰기 앱입니다. 구문 강조와 깔끔한 고정폭 캔버스가 글쓰기를 마찰 없이 느껴지게 하는 점을 관찰하세요."],
"oko": ["A navigation aid for blind and low-vision pedestrians earning Inclusivity by using AI to read traffic signals and guide users safely across intersections. Watch how camera-based signal detection and audio-haptic cues replace sight at the crosswalk.", "AI로 신호등을 읽어 교차로를 안전하게 건너도록 안내해 시각장애·저시력 보행자를 돕는 점으로 Inclusivity를 받은 내비게이션 보조 앱입니다. 카메라 기반 신호 인식과 음성·햅틱 신호가 횡단보도에서 시각을 대신하는 방식을 지켜보세요."],
"puffies.": ["A gentle puzzle game from an accessibility-minded studio earning Inclusivity through calm, no-fail play and broad device support that welcomes players of every ability. Notice how the soft visuals, forgiving design, and Vision Pro to Apple TV reach lower every barrier to entry.", "접근성을 중시하는 스튜디오의 잔잔한 퍼즐 게임으로, 차분하고 실패 없는 플레이와 폭넓은 기기 지원으로 모든 사용자를 포용해 Inclusivity를 받았습니다. 부드러운 비주얼과 너그러운 디자인, Vision Pro부터 Apple TV까지의 지원이 진입 장벽을 낮추는 점을 눈여겨보세요."],
"quadline": ["A clean line-puzzle game earning Inclusivity through simple, intuitive rules and broad platform support that make it easy for anyone to pick up and play. Observe how the minimalist design and gentle difficulty curve welcome players regardless of experience.", "단순하고 직관적인 규칙과 폭넓은 플랫폼 지원으로 누구나 쉽게 시작할 수 있게 해 Inclusivity를 받은 깔끔한 선 잇기 퍼즐 게임입니다. 미니멀한 디자인과 부드러운 난이도 곡선이 경험과 무관하게 플레이어를 환대하는 점을 관찰하세요."],

function whyText(name){const e=WHY[name];return e?(lang==="en"?e[0]:e[1]):"";}

// ─── Icon fetching ─────────────────────────────────────────────────────────────
const iconCache = {};
function appId(url){const m=url.match(/id(\d+)/);return m?m[1]:null;}
function storeCountry(url){const m=url.match(/apps\.apple\.com\/([a-z]{2})\//);return m?m[1]:"us";}

let jsonpId=0;
function jsonp(url){
  return new Promise(resolve=>{
    const name="__ic"+(jsonpId++);
    const s=document.createElement("script");
    let done=false;
    window[name]=function(data){done=true;try{resolve(data)}finally{delete window[name];s.remove();}};
    s.onerror=()=>{if(!done){delete window[name];s.remove();resolve(null);}};
    s.src=url+(url.includes("?")?"&":"?")+"callback="+name;
    document.head.appendChild(s);
    setTimeout(()=>{if(!done){try{delete window[name]}catch(e){}; s.remove(); resolve(null);}},8000);
  });
}
function applyResults(data){
  if(!data||!data.results)return;
  data.results.forEach(r=>{
    const id=String(r.trackId||"");
    let a=r.artworkUrl100||r.artworkUrl512||r.artworkUrl60;
    if(id && a){
      a=a.replace(/\/\d+x\d+bb\.(jpg|jpeg|png|webp)/,"/180x180bb.$1");
      iconCache[id]=a;
    }
  });
  patchIcons();
}
async function fetchIcons(){
  const byC={};
  DATA.forEach(d=>{const id=appId(d.url);if(!id)return;const cc=storeCountry(d.url);(byC[cc]=byC[cc]||new Set()).add(id);});
  const jobs=[];
  for(const cc in byC){
    const ids=[...byC[cc]];
    for(let i=0;i<ids.length;i+=18){
      const batch=ids.slice(i,i+18).join(",");
      jobs.push(jsonp("https://itunes.apple.com/lookup?country="+cc+"&id="+batch).then(applyResults));
    }
  }
  await Promise.all(jobs);
}
function patchIcons(){
  document.querySelectorAll('.icon[data-appid]').forEach(el=>{
    const id=el.dataset.appid;
    if(iconCache[id] && el.dataset.loaded!=="1"){
      el.dataset.loaded="1";
      const img=new Image();
      img.alt="";
      img.onload=()=>{el.innerHTML="";el.appendChild(img);};
      img.src=iconCache[id];
    }
  });
}

// ─── State & chips ────────────────────────────────────────────────────────────
const state={year:"all",cat:"all",type:"all",q:"",showFinalists:false};
const YEARS=[...new Set(DATA.map(d=>d.year))].sort((a,b)=>b-a);

function buildChips(){
  const yearChips=document.getElementById("yearChips");
  yearChips.innerHTML="";
  yearChips.appendChild(makeChip(t('all'),"all",()=>{state.year="all";render();},"year"));
  YEARS.forEach(y=>yearChips.appendChild(makeChip(String(y),String(y),()=>{state.year=String(y);render();},"year")));

  const catChips=document.getElementById("catChips");
  catChips.innerHTML="";
  catChips.appendChild(makeChip(t('all'),"all",()=>{state.cat="all";render();},"cat"));
  CAT_ORDER.forEach(k=>{
    const c=CATS[k];
    const chip=makeChip(c[lang],k,()=>{state.cat=k;render();},"cat");
    const dot=document.createElement("span");dot.className="dot";dot.style.background=`var(${c.v})`;
    chip.prepend(dot);chip.dataset.color=c.v;
    catChips.appendChild(chip);
  });
}

function makeChip(label,val,onclick,kind){
  const b=document.createElement("button");
  b.className="chip "+kind;b.textContent=label;b.dataset.val=val;b.dataset.kind=kind;
  b.addEventListener("click",onclick);return b;
}

document.querySelectorAll(".chip.type").forEach(b=>b.addEventListener("click",()=>{state.type=b.dataset.type;render();}));
const finToggle=document.getElementById("finToggle");
finToggle.addEventListener("click",()=>{state.showFinalists=!state.showFinalists;finToggle.classList.toggle("on",state.showFinalists);render();});
document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase();render();});

document.getElementById("stWin").textContent=DATA.filter(d=>d.award==="winner").length;
document.getElementById("stFin").textContent=DATA.filter(d=>d.award==="finalist").length;

// ─── Render ───────────────────────────────────────────────────────────────────
function setActive(){
  document.querySelectorAll(".chip.year").forEach(b=>b.classList.toggle("active",b.dataset.val===state.year));
  document.querySelectorAll(".chip.cat").forEach(b=>{
    const on=b.dataset.val===state.cat;
    b.classList.toggle("active",on);
    if(on&&b.dataset.color){b.style.background=`var(${b.dataset.color})`;b.style.borderColor=`var(${b.dataset.color})`;}
    else{b.style.background="";b.style.borderColor="";}
  });
  document.querySelectorAll(".chip.type").forEach(b=>b.classList.toggle("active",b.dataset.type===state.type));
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function monogram(name){const m=name.match(/[A-Za-z0-9]/);return escapeHtml(m?m[0].toUpperCase():"·");}

function cardHTML(d){
  const c=CATS[d.cat];
  const id=appId(d.url);
  const country=d.country?`<span class="country"> · ${escapeHtml(d.country)}</span>`:"";
  const typeLbl=d.type==="app"?t('typeApp'):t('typeGame');
  const awardLbl=d.award==="winner"?t('awardWinner'):t('awardFinalist');
  const ico=d.award==="winner"?"★":"○";
  const iconInner=(id&&iconCache[id])
    ? `<img src="${iconCache[id]}" alt="">`
    : `<span class="mono">${monogram(d.name)}</span>`;
  const dataAttr=id?` data-appid="${id}"${iconCache[id]?' data-loaded="1"':''}`:"";
  return `<article class="card" style="--ac:var(${c.v})">
    <div class="card-head">
      <div class="icon"${dataAttr}>${iconInner}</div>
      <div class="head-text">
        <h3><a href="${d.url}" target="_blank" rel="noopener">${escapeHtml(d.name)}</a></h3>
        <div class="dev">${escapeHtml(d.dev)}${country}</div>
      </div>
    </div>
    <div class="badges">
      <span class="badge cat">${escapeHtml(c[lang])}</span>
      <span class="badge type">${typeLbl}</span>
      <span class="badge award ${d.award}">${ico} ${awardLbl}</span>
    </div>
    ${(()=>{const wy=whyText(d.name);return wy?`<div class="why"><span class="why-label">${t('whyLabel')}</span>${escapeHtml(wy)}</div>`:"";})()}
    <div class="plats">${escapeHtml(d.plats)}</div>
    <a class="dl" href="${d.url}" target="_blank" rel="noopener">${t('dlBtn')}
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17 17 7M9 7h8v8"/></svg>
    </a>
  </article>`;
}

function render(){
  setActive();
  let rows=DATA.filter(d=>{
    if(!state.showFinalists&&d.award!=="winner")return false;
    if(state.year!=="all"&&String(d.year)!==state.year)return false;
    if(state.cat!=="all"&&d.cat!==state.cat)return false;
    if(state.type!=="all"&&d.type!==state.type)return false;
    if(state.q){const hay=(d.name+" "+d.dev+" "+(d.country||"")).toLowerCase();if(!hay.includes(state.q))return false;}
    return true;
  });
  const results=document.getElementById("results");
  const meta=document.getElementById("metaLine");
  const winN=rows.filter(r=>r.award==="winner").length;
  const finN=rows.filter(r=>r.award==="finalist").length;
  meta.innerHTML=state.showFinalists
    ? t('metaWithFin', rows.length, winN, finN)
    : t('metaWinOnly', winN);
  if(rows.length===0){
    results.innerHTML=`<div class="empty"><div class="big">${t('noResults')}</div><div class="sub">${t('noResultsSub')}</div></div>`;return;
  }
  const yrs=[...new Set(rows.map(r=>r.year))].sort((a,b)=>b-a);
  results.innerHTML=yrs.map(yr=>{
    const items=rows.filter(r=>r.year===yr);
    items.sort((a,b)=>{
      const ci=CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat);
      if(ci!==0)return ci;
      if(a.award!==b.award)return a.award==="winner"?-1:1;
      return a.type.localeCompare(b.type);
    });
    const catCount=new Set(items.map(i=>i.cat)).size;
    const note=yr===2020?t('yearNote2020'):t('yearNote', catCount, items.length);
    return `<section class="yeargroup">
      <div class="yearhead"><span class="yr">${yr}</span><span class="yc">${note}</span></div>
      <div class="grid">${items.map(cardHTML).join("")}</div>
    </section>`;
  }).join("");
  patchIcons();
}

// ─── Init ─────────────────────────────────────────────────────────────────────
applyLang();
buildChips();
render();
fetchIcons();
</script>
</body>
</html>
